<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181d">
<title>Perícia Lab · Carômetro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15181d; --ink2:#50565f; --ink3:#878d96; --line:#d3d7dd; --bg:#e9ebee; --paper:#fff;
  --tag:#f4c20d; --accent:#0a6d83; --accent-ink:#fff;
  --bad:#b3261e; --badbg:#fde4e1; --warn:#8a5a00; --warnbg:#fff1cc; --pend:#4d535b; --pendbg:#eceef1;
  --ok:#1d6b34; --okbg:#dcf2e2;
  --f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fc:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--f)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* topo */
.top{background:var(--ink);color:#fff;padding:.65rem 1rem .55rem;border-bottom:4px solid var(--tag);display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.top h1{margin:0;font:700 1.5rem/1 var(--fc);letter-spacing:.02em}
.top small{display:block;color:#aeb4bd;font-size:.76rem;margin-top:.15rem}
.top .sp{flex:1}
.pill{border:1px solid #5c636d;color:#dfe3e8;border-radius:999px;padding:.25rem .75rem;font-size:.8rem;background:transparent;white-space:nowrap}
.pill.ok{border-color:#6fbf73;color:#c4ebc6}
.pill.err{border-color:#e0786f;color:#ffcbc6}
.pill.demo{border-color:var(--tag);color:#ffe28a}
.nav{display:flex;gap:.2rem;padding:.4rem 1rem 0;overflow-x:auto;background:var(--bg);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:.55rem .8rem;font-weight:500;color:var(--ink2);white-space:nowrap}
.nav button[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}

main{padding:1rem;max-width:1400px;margin:0 auto}
h2{font:700 1.35rem/1.1 var(--fc);margin:0 0 .5rem;letter-spacing:.01em}
h3{font:700 1.1rem/1.1 var(--fc);margin:1.3rem 0 .45rem;letter-spacing:.01em}
.hint{color:var(--ink2);margin:.1rem 0 .8rem;font-size:.88rem;max-width:72ch}
.banner{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:.6rem .8rem;margin:0 0 1rem;font-size:.88rem}
.banner.err{background:var(--badbg);color:var(--bad)}

/* episódios */
.eps{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem;margin-bottom:.9rem}
.ep{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.35rem .7rem;text-align:left;min-width:4.6rem;flex:none}
.ep b{display:block;font:700 1.1rem/1 var(--fc)}
.ep span{font-size:.72rem;color:var(--ink2)}
.ep[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.ep[aria-pressed=true] span{color:#b9bfc7}
.ep .dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:var(--bad);margin-left:.25rem;vertical-align:middle}

.sumario{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:-.2rem 0 .9rem;font-size:.86rem;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:.25rem;border-radius:999px;padding:.08rem .55rem;font-size:.76rem;font-weight:600;white-space:nowrap}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.pend{background:var(--pendbg);color:var(--pend)}
.chip.ok{background:var(--okbg);color:var(--ok)}

/* carômetro */
.grupo{margin:0 0 1.3rem}
.grupo>h3{margin:0 0 .5rem;display:flex;align-items:baseline;gap:.5rem}
.grupo>h3 small{font:500 .8rem var(--f);color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}}
.card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;text-align:left;position:relative;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.12)}
.card:active{transform:scale(.985)}
.card .ft{aspect-ratio:4/3;position:relative;display:grid;place-items:center;color:#fff;font:700 2.6rem/1 var(--fc);overflow:hidden}
.card .ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .bd{padding:.5rem .6rem .6rem;display:flex;flex-direction:column;gap:.3rem;flex:1}
.card .nm{font:700 1.3rem/1.02 var(--fc);text-transform:uppercase;letter-spacing:.015em;overflow-wrap:anywhere}
.card .eq{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.card .sub{font-size:.76rem;color:var(--ink2)}
.card .al{display:flex;gap:.25rem;flex-wrap:wrap}
.card .al .chip{white-space:normal;line-height:1.25;padding:.12rem .5rem}
.card.bad{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.card.fora{filter:grayscale(1);opacity:.55}
.card.fora .nm{text-decoration:line-through;text-decoration-thickness:2px}
.card .papel{position:absolute;top:.4rem;left:.4rem;background:rgba(21,24,29,.82);color:#fff;font:600 .66rem/1 var(--f);letter-spacing:.05em;padding:.28rem .45rem;border-radius:4px;text-transform:uppercase}
.card .col{position:absolute;top:.4rem;right:.4rem}
.tag{display:inline-grid;place-items:center;min-width:2.4rem;height:1.75rem;padding:.15rem .4rem 0;background:var(--tag);color:var(--ink);font:700 1.15rem/1 var(--fc);border-radius:4px;white-space:nowrap}
.tag.vazio{background:var(--pendbg);color:var(--ink3)}
.tag.cap{background:var(--ink);color:#fff;font-size:.95rem}
.tag.cap.bege{background:#d8c3a2;color:#2a2116}
.tag.cap.marrom{background:#6a4630;color:#fff}
.cor{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;vertical-align:-1px;margin-right:.3rem;border:1px solid rgba(0,0,0,.3);flex:none}
.cor.bege{background:#d8c3a2}.cor.preto{background:#15181d}.cor.marrom{background:#6a4630}
.tag.sm{height:1.4rem;min-width:1.9rem;font-size:.95rem}
.av{position:relative;display:inline-grid;place-items:center;border-radius:50%;color:#fff;font:700 1rem/1 var(--fc);overflow:hidden;flex:none;width:2.4rem;height:2.4rem}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* editor */
.ov{position:fixed;inset:0;background:rgba(10,12,15,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:760px){.ov{align-items:center;padding:1.5rem}}
.sheet{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media(min-width:760px){.sheet{border-radius:14px;max-height:88vh}}
.sh-hd{position:sticky;top:0;background:var(--paper);display:flex;gap:.8rem;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--line);z-index:1}
.sh-hd .av{width:3.6rem;height:3.6rem;border-radius:10px;font-size:1.6rem}
.sh-hd h2{margin:0;font-size:1.8rem;text-transform:uppercase}
.sh-hd .sp{flex:1}
.sh-hd .x{background:var(--pendbg);border:0;border-radius:999px;width:2.4rem;height:2.4rem;font-size:1.3rem;line-height:1}
.sh-bd{padding:.8rem 1rem 1.4rem}
.sh-bd h3:first-child{margin-top:.2rem}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:.45rem}
.opt{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:.45rem .55rem;text-align:left;display:flex;flex-direction:column;gap:.1rem;min-height:3.6rem}
.opt b{font:700 1.15rem/1 var(--fc)}
.opt b i{font-style:normal;background:var(--tag);border-radius:3px;padding:.05rem .3rem;margin-right:.3rem}
.opt span{font-size:.74rem;color:var(--ink2)}
.opt[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.opt[aria-pressed=true] span{color:#c6cbd2}
.opt[aria-pressed=true] b i{color:var(--ink)}
.opt:disabled{opacity:.42;cursor:not-allowed;background:var(--pendbg)}
.opt.limpar{justify-content:center;align-items:center;color:var(--ink2);border-style:dashed}
.det{display:grid;grid-template-columns:auto 1fr;gap:.25rem .9rem;margin:.2rem 0;font-size:.92rem}
.det dt{color:var(--ink2)}
.det dd{margin:0;font-weight:600}
.alertas{display:flex;flex-direction:column;gap:.4rem;margin:.2rem 0 .4rem}
.alerta{border-radius:8px;padding:.55rem .7rem;font-size:.88rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.alerta.bad{background:var(--badbg);color:var(--bad)}
.alerta.warn{background:var(--warnbg);color:var(--warn)}
.alerta.pend{background:var(--pendbg);color:var(--pend)}
.alerta .sp{flex:1}
.linha{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.btn{background:var(--paper);border:1px solid var(--ink2);border-radius:7px;padding:.45rem .85rem;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dan{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:.25rem .6rem;font-size:.84rem}
.seg{display:inline-flex;border:1px solid var(--ink2);border-radius:7px;overflow:hidden}
.seg button{background:var(--paper);border:0;padding:.4rem .85rem;font-weight:600;border-left:1px solid var(--line)}
.seg{max-width:100%;overflow-x:auto}
.seg button{white-space:nowrap;flex:none}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
input[type=text],input[type=url],select{background:#fff;border:1px solid var(--line);border-radius:7px;padding:.45rem .6rem;min-height:2.4rem}
label.campo{display:block;font-size:.8rem;color:var(--ink2);font-weight:500}
label.campo input,label.campo select{display:block;width:100%;margin-top:.15rem;color:var(--ink);font-size:.95rem}
.toggle{display:flex;gap:.6rem;align-items:center;background:var(--pendbg);border-radius:8px;padding:.6rem .7rem;font-weight:600}
.toggle input{width:1.3rem;height:1.3rem;accent-color:var(--bad)}

/* documento */
.bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.1rem 0 1rem}
.bar .sp{flex:1}
.doc{background:var(--paper);border:1px solid var(--line);padding:1.1rem 1.2rem;border-radius:4px}
.dochead{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;border-bottom:3px solid var(--ink);padding-bottom:.5rem;margin-bottom:.9rem}
.dochead h1{margin:0;font:700 1.8rem/1 var(--fc)}
.dochead p{margin:.25rem 0 0;color:var(--ink2);font-weight:600}
.dochead .r{text-align:right;font-size:.78rem;color:var(--ink2)}
.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.7rem}
.ficha{border:1.5px solid var(--ink);border-radius:5px;display:grid;grid-template-columns:88px 1fr;overflow:hidden;break-inside:avoid;background:#fff}
.ficha .ft{position:relative;display:grid;place-items:center;color:#fff;font:700 2rem/1 var(--fc);min-height:100%}
.ficha .ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ficha .bd{padding:.45rem .55rem}
.ficha .hd{display:flex;gap:.45rem;align-items:center;margin-bottom:.3rem;min-width:0}
.ficha .hd .tag{flex:none}
.ficha .hd>div{min-width:0}
.ficha h4{margin:0;font:700 1.25rem/1 var(--fc);text-transform:uppercase;overflow-wrap:anywhere}
.ficha .sub{font-size:.72rem;color:var(--ink2)}
.ficha dl{display:grid;grid-template-columns:auto 1fr;gap:.05rem .55rem;margin:0;font-size:.8rem}
.ficha dt{color:var(--ink2)}
.ficha dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.ficha .nota{grid-column:1/-1;margin-top:.25rem;font-size:.72rem;color:var(--ink2);border-top:1px solid var(--line);padding-top:.2rem}
table.tab{border-collapse:collapse;width:100%;font-size:.84rem}
table.tab th{background:var(--ink);color:#fff;font-weight:600;text-align:left;padding:.35rem .45rem;font-size:.74rem;white-space:nowrap}
table.tab td{border-bottom:1px solid var(--line);padding:.32rem .45rem;vertical-align:middle;white-space:nowrap}
table.tab td.n,table.tab td.w{white-space:normal}
table.tab td.n{font-weight:700;text-transform:uppercase;font-family:var(--fc);font-size:1rem}
table.tab tr{break-inside:avoid}
table.tab tr.mentor td{background:#f6f7f9;color:var(--ink2);font-size:.78rem}
.tabwrap{overflow-x:auto}
.livres{margin-top:.8rem;font-size:.8rem;color:var(--ink2)}

.painel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem;max-width:56rem}
.painel h3{margin-top:0}
pre{background:#14171c;color:#d6dae0;padding:.8rem;border-radius:6px;overflow:auto;font-size:.78rem;max-height:18rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:8px;z-index:40;font-size:.9rem;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.err{background:var(--bad)}


/* mixer */
.console{--sw:74px;background:#1b1d21;border-radius:12px;padding:.7rem .7rem .9rem;overflow-x:auto;box-shadow:inset 0 0 0 1px #2c2f35}
.mrow{display:grid;gap:4px 6px;margin-bottom:.9rem;width:max-content}
.mrow:last-child{margin-bottom:0}
.band{font:600 .66rem/1 var(--f);letter-spacing:.05em;text-transform:uppercase;padding:.3rem .45rem;border-radius:4px;color:#d7dbe0;white-space:nowrap;overflow:hidden}
.band.ctl{background:#2a2d33;color:#9aa1ab}
.band.ctl.cl{background:#c9a36a;color:#2a1d0c}
.band.zb.z0{background:#3a3f48}.band.zb.z1{background:#2e3a4c}.band.zb.z2{background:#4b2f45}.band.zb.z3{background:#2f3a33}
.strip{width:var(--sw);height:236px;background:#26292e;border:1px solid #34383f;border-radius:7px;display:flex;flex-direction:column;align-items:center;padding:.3rem .25rem;gap:.25rem;color:#e9ecef;position:relative;cursor:grab}
.strip.z2{background:#2b2430}.strip.z3{background:#232a25}
.strip .slab{width:100%;background:#0e0f11;border-radius:4px;font:700 .82rem/1 var(--fc);letter-spacing:.02em;padding:.35rem .15rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:clip}
.strip .sph .av{width:2rem;height:2rem;font-size:.8rem}
.strip .sph{height:2rem}
.strip .ssub{font-size:.6rem;color:#a9b0b9;text-align:center;line-height:1.15;min-height:1.4rem}
.strip .strk{flex:1;width:6px;background:#0b0c0e;border-radius:3px;position:relative;margin:.15rem 0}
.strip .scap{position:absolute;left:50%;top:38%;width:30px;height:22px;transform:translateX(-50%);border-radius:3px;box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 -3px 0 rgba(0,0,0,.25)}
.strip .scap.sd{background:#e2b254;width:22px;height:34px;border:2px solid #fff;border-radius:4px}
.strip .sfoot{font:600 .74rem/1 var(--f);background:#0e0f11;border-radius:4px;width:100%;text-align:center;padding:.3rem 0}
.strip .xout{position:absolute;bottom:2rem;left:0;right:0;text-align:center;font-size:.58rem;color:#f0b8e0}
.strip.vazio{opacity:.45}
.strip.vazio .slab{color:#6c727b}
.strip.copia{border-style:dashed}
.strip.sel{outline:3px solid var(--tag);outline-offset:1px}
.strip.alvo:hover{outline:2px dashed var(--tag)}
.mpan{margin-top:.9rem;max-width:40rem}
.alerta.ok{background:var(--okbg);color:var(--ok)}
.fita{display:grid;grid-template-columns:repeat(12,1fr);border:1px solid #000}
.fita span{border-right:1px solid #000;padding:.3rem .2rem;text-align:center;font:700 .8rem/1.1 var(--fc);text-transform:uppercase;min-height:2.6rem;display:flex;flex-direction:column;justify-content:space-between}
.fita span i{font-style:normal;font:500 .62rem var(--f);color:#555}
.soimpr{display:none}
@media print{
  @page{size:A4 portrait;margin:9mm}
  @page paisagem{size:A4 landscape;margin:8mm}
  .doc.tabela{page:paisagem}
  body{background:#fff;font-size:10.5px}
  .top,.nav,.eps,.bar,.noprint,.banner,.sumario,.toast,#modal,.console,.alertas{display:none!important}
  .soimpr{display:block!important}
  .fita span{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  main{padding:0;max-width:none}
  .doc{border:0;padding:0}
  .fichas{grid-template-columns:repeat(3,1fr);gap:4mm}
  .tag,.cor,.ficha .ft,table.tab th,.av,.card .ft{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .painel{border:0;padding:0;max-width:none}
}
</style>
</head>
<body>
<header class="top">
  <div><h1>Perícia Lab · Carômetro</h1><small>Quem está com qual transmissor e cápsula, episódio a episódio</small></div>
  <div class="sp"></div>
  <button class="pill" id="status" type="button" data-act="sync">carregando…</button>
</header>
<nav class="nav" id="nav" aria-label="Seções"></nav>
<main id="app"></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s,el){return (el||document).querySelector(s);}
function jget(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function clone(o){return JSON.parse(JSON.stringify(o));}
function str(v){return v==null?'':String(v).trim();}
function num(v){if(typeof v==='number')return v;var n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?NaN:n;}
function int(v){var n=parseInt(v,10);return isNaN(n)?0:n;}
function mhz(v){return isNaN(v)?'':v.toFixed(3).replace('.',',');}
function nat(a,b){return String(a).localeCompare(String(b),'pt',{numeric:true});}
function agora(){var d=new Date();function p(n){return ('0'+n).slice(-2);}return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());}
function cor(n){var h=0;n=String(n);for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return 'hsl('+h+' 30% 34%)';}
function iniciais(n){var w=String(n).trim().split(/\s+/);return ((w[0]||'?')[0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase();}
function toast(t,err){var el=$('#toast');el.textContent=t;el.className='toast'+(err?' err':'');el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true;},err?6000:2600);}

function linhas(R,k){return (R&&R[k])||[];}
function normalizar(R){
  var d={};
  d.tx=linhas(R,'tx').map(function(o){return {
    num:str(o['TX']),nome:str(o['Nome']),wd:str(o['Nome no Wireless Designer']),modelo:str(o['Modelo']),
    mod:str(o['Modulação']),passo:str(o['Passo (kHz)']),bloco:str(o['Bloco']),faixa:str(o['Faixa (MHz)']),
    rx:str(o['Receptor']),input:str(o['Input do Scorpio']),canal:str(o['Canal no gravador']),
    rxM:str(o['Receptor na sala dos mentores']),canalM:str(o['Canal na sala dos mentores']),
    freq:num(o['Freq. (MHz)']),cod:str(o['Código']),
    ajustado:o['Aparelho ajustado']===true||/^(true|verdadeiro|sim)$/i.test(str(o['Aparelho ajustado'])),
    report:str(o['Report de origem']),dono:str(o['Dono']),dev:int(o['Devolve após EP']),obs:str(o['Observações'])};})
    .filter(function(t){return t.num;});
  d.txPor={};d.tx.forEach(function(t){d.txPor[t.num]=t;});
  d.rx=linhas(R,'rx').map(function(o){return {id:str(o['Receptor']),modelo:str(o['Modelo']),input:str(o['Input do Scorpio']),conector:str(o['Conector']),canal:str(o['Canal no gravador']),dono:str(o['Dono']),dev:int(o['Devolve após EP']),obs:str(o['Observações'])};}).filter(function(r){return r.id;});
  d.rxPor={};d.rx.forEach(function(r){d.rxPor[r.id]=r;});
  d.cap=linhas(R,'cap').map(function(o){return {id:str(o['Cápsula']),tipo:str(o['Tipo']).toLowerCase()||'lapela',modelo:str(o['Modelo']),dono:str(o['Dono']),dev:int(o['Devolve após EP']),obs:str(o['Observações']),cor:str(o['Cor']).toLowerCase()};}).filter(function(c){return c.id;});
  d.capPor={};d.cap.forEach(function(c){d.capPor[c.id]=c;});
  d.elenco=linhas(R,'elenco').map(function(o,ix){return {ix:ix,id:str(o['ID']),nome:str(o['Nome'])||str(o['ID']),papel:str(o['Papel']).toUpperCase()||'PARTICIPANTE',colinha:str(o['Colinha (pista)']),foto:str(o['Foto']),elim:int(o['Eliminado após EP']),obs:str(o['Observações']),pista:str(o['Nome de pista'])};}).filter(function(p){return p.id;});
  d.elenco.sort(function(a,b){return (ORDEM_PAPEL[a.papel]==null?9:ORDEM_PAPEL[a.papel])-(ORDEM_PAPEL[b.papel]==null?9:ORDEM_PAPEL[b.papel])||nat(a.colinha||'99',b.colinha||'99')||a.ix-b.ix;});
  d.pPor={};d.elenco.forEach(function(p){d.pPor[p.id]=p;});
  d.esc=linhas(R,'esc').map(function(o){return {ep:int(o['EP']),id:str(o['ID']),tx:str(o['TX']),cap:str(o['Cápsula']),time:str(o['Time']),obs:str(o['Observações']),em:str(o['Atualizado em']),por:str(o['Por'])};}).filter(function(r){return r.ep&&r.id;});
  d.eps=linhas(R,'eps').map(function(o){return {ep:int(o['EP']),a:int(o['Equipe A']),b:int(o['Equipe B']),data:str(o['Data de gravação'])};}).filter(function(e){return e.ep;}).sort(function(a,b){return a.ep-b.ep;});
  if(!d.eps.length)for(var i=1;i<=8;i++)d.eps.push({ep:i,a:0,b:0,data:''});
  d.imp=linhas(R,'imp').map(function(o){return {gerado:str(o['Report gerado em']),em:str(o['Importado em']),por:str(o['Por']),n:str(o['Transmissores atualizados']),mud:str(o['Mudanças']),nao:str(o['Nomes sem correspondência'])};});
  d.cenas=Array.isArray(R&&R.cenas)?R.cenas.map(function(o){var pp=[];try{pp=JSON.parse(str(o['Pistas'])||'[]');}catch(e){}while(pp.length<32)pp.push('');return {id:str(o['ID']),nome:str(o['Nome'])||str(o['ID']),ordem:str(o['Ordem'])||'alfa',pistas:pp.slice(0,32)};}).filter(function(c){return c.id;}):null;
  d.lidoEm=str(R&&R.lidoEm);d.planilha=str(R&&R.planilha);
  return d;
}

/* aplica uma alteração sobre os dados crus (modo demonstração e alterações ainda na fila) */
function aplicar(R,op){
  var i,o;
  if(op.acao==='escalar'){
    var achou=null;
    for(i=R.esc.length-1;i>=0;i--)if(int(R.esc[i]['EP'])===op.ep&&str(R.esc[i]['ID'])===op.id){achou=R.esc[i];break;}
    if(!achou){
      var ef=efetivoCru(R,op.ep)[op.id]||{};
      achou={'EP':op.ep,'ID':op.id,'Nome':'','TX':ef.tx||'','Cápsula':ef.cap||'','Time':ef.time||'','Observações':ef.obs||''};
      R.esc.push(achou);
    }
    ['tx','cap','time','obs'].forEach(function(k){if(op[k]!==undefined)achou[{tx:'TX',cap:'Cápsula',time:'Time',obs:'Observações'}[k]]=op[k];});
    achou['Atualizado em']=agora();achou['Por']=op.por||'';
  }else if(op.acao==='eliminar'){
    R.elenco.forEach(function(p){if(str(p['ID'])===op.id)p['Eliminado após EP']=op.ep||'';});
  }else if(op.acao==='ajustado'){
    R.tx.forEach(function(t){if(str(t['TX'])===String(op.tx))t['Aparelho ajustado']=!!op.valor;});
  }else if(op.acao==='importar'){
    var mud=[];
    op.itens.forEach(function(it){R.tx.forEach(function(t){
      if(str(t['TX'])!==String(it.tx))return;
      var antes=num(t['Freq. (MHz)']);
      if(!(Math.abs(antes-it.freq)<0.0005)){mud.push('TX '+it.tx+': '+(isNaN(antes)?'—':antes.toFixed(3))+' → '+it.freq.toFixed(3));t['Freq. (MHz)']=it.freq;t['Aparelho ajustado']=false;}
      t['Report de origem']=op.gerado;
    });});
    R.imp=R.imp||[];R.imp.push({'Report gerado em':op.gerado,'Importado em':agora(),'Por':op.por||'','Transmissores atualizados':op.itens.length,'Mudanças':mud.join('; ')||'Nenhuma frequência mudou','Nomes sem correspondência':(op.naoCasados||[]).join(', ')});
  }else if(op.acao==='foto'){
    R.elenco.forEach(function(p){if(str(p['ID'])===op.id)p['Foto']=op.preview;});
  }else if(op.acao==='pessoa'){
    o=null;R.elenco.forEach(function(p){if(str(p['ID'])===op.id)o=p;});
    if(!o){o={'ID':op.id};R.elenco.push(o);}
    if(op.nome!==undefined)o['Nome']=op.nome;
    if(op.papel!==undefined)o['Papel']=op.papel;
    if(op.colinha!==undefined)o['Colinha (pista)']=op.colinha;
    if(op.pista!==undefined)o['Nome de pista']=op.pista;
  }else if(op.acao==='cena'){
    R.cenas=(R.cenas||[]).filter(function(c){return str(c['ID'])!==op.id;});
    if(!op.apagar)R.cenas.push({'ID':op.id,'Nome':op.nome,'Ordem':op.ordem,'Pistas':op.pistas,'Atualizado em':agora(),'Por':op.por||''});
  }
}
function efetivoCru(R,ep){
  var m={};
  (R.esc||[]).forEach(function(r,i){var e=int(r['EP']),id=str(r['ID']);if(!(e<=ep))return;var c=m[id];
    if(!c||e>c.ep||(e===c.ep&&i>c.i))m[id]={ep:e,i:i,tx:str(r['TX']),cap:str(r['Cápsula']),time:str(r['Time']),obs:str(r['Observações'])};});
  return m;
}
function recalcular(){
  var R=RAW?clone(RAW):{tx:[],rx:[],cap:[],elenco:[],esc:[],eps:[],imp:[]};
  ['tx','rx','cap','elenco','esc','eps','imp'].forEach(function(k){if(!R[k])R[k]=[];});
  FILA.forEach(function(op){try{aplicar(R,op);}catch(e){}});
  D=normalizar(R);
}

/* ───────── lógica do episódio ───────── */
function efetivo(ep){
  var m={};
  D.esc.forEach(function(r,i){if(!(r.ep<=ep))return;var c=m[r.id];if(!c||r.ep>c.ep||(r.ep===c.ep&&i>c.i))m[r.id]=Object.assign({i:i},r);});
  return m;
}
function ativo(p,ep){return !(p.elim&&ep>p.elim);}
function tipoCap(p){
  var n=(p.id+' '+p.nome).toLowerCase();
  if(p.papel==='FONTE'&&n.indexOf('goose')>=0)return 'gooseneck';
  if(p.papel==='FONTE'&&n.indexOf('boom')>=0)return 'boom';
  return 'lapela';
}
function situacao(ep){
  var EF=efetivo(ep),uso={tx:{},cap:{}},s={ep:ep,EF:EF,uso:uso,pessoas:[],avisos:0,graves:0};
  D.elenco.forEach(function(p){
    if(!ativo(p,ep))return;
    var e=EF[p.id];if(!e)return;
    if(e.tx)(uso.tx[e.tx]=uso.tx[e.tx]||[]).push(p.id);
    if(e.cap)(uso.cap[e.cap]=uso.cap[e.cap]||[]).push(p.id);
  });
  D.elenco.forEach(function(p){
    var e=EF[p.id]||null,t=e&&e.tx?D.txPor[e.tx]||null:null,av=[],at=ativo(p,ep);
    if(at){
      if(!e||!e.tx)av.push({k:'pend',t:'sem transmissor'});
      else if(!t)av.push({k:'bad',t:'TX '+e.tx+' não existe na planilha'});
      if(t&&t.dev&&ep>t.dev)av.push({k:'bad',t:'TX '+t.num+' foi devolvido após o EP '+t.dev,trocar:true});
      if(e&&e.tx&&uso.tx[e.tx]&&uso.tx[e.tx].length>1)av.push({k:'bad',t:'TX '+e.tx+' repetido'});
      if(e&&e.cap&&uso.cap[e.cap]&&uso.cap[e.cap].length>1)av.push({k:'bad',t:'cápsula '+e.cap+' repetida'});
      if(!e||!e.cap)av.push({k:'pend',t:'sem cápsula'});
      var c=e&&e.cap?D.capPor[e.cap]:null;
      if(c&&c.dev&&ep>c.dev)av.push({k:'bad',t:'cápsula '+c.id+' foi devolvida após o EP '+c.dev});
      if(t&&t.num!=='GN'&&!t.rx)av.push({k:'warn',t:'TX sem receptor fixo'});
      if(t&&!isNaN(t.freq)&&!t.ajustado&&!(t.dev&&ep>t.dev))av.push({k:'warn',t:'conferir frequência no aparelho',c:'ajustar freq.',ajuste:true});
    }
    av.forEach(function(a){s.avisos++;if(a.k==='bad')s.graves++;});
    s.pessoas.push({p:p,e:e,t:t,herdado:e&&e.ep<ep?e.ep:0,av:av,ativo:at});
  });
  return s;
}
function contaEp(ep){var n=0;D.elenco.forEach(function(p){if(ativo(p,ep)&&p.papel!=='FONTE')n++;});return n;}

/* ───────── rede ───────── */
function setStatus(){
  var b=$('#status');if(!b)return;
  b.className='pill';
  if(MODO==='demo'){b.className+=' demo';b.textContent='demonstração';return;}
  if(NET==='off'){b.className+=' err';b.textContent=FILA.length?FILA.length+' alteração(ões) esperando conexão':'sem conexão';return;}
  if(enviando||NET==='sync'){b.textContent='sincronizando…';return;}
  b.className+=' ok';b.textContent='sincronizado'+(D&&D.lidoEm?' · '+D.lidoEm.slice(11,16):'');
}
function buscar(){
  if(MODO!=='api')return Promise.resolve();
  if(!FILA.length&&!enviando){NET='sync';setStatus();}
  return fetch(API,{redirect:'follow'}).then(function(r){return r.json();}).then(function(j){
    if(!j.ok)throw new Error(j.erro||'erro');
    var antes=JSON.stringify(RAW&&Object.assign({},RAW,{lidoEm:''}));
    RAW=j.dados;jset(K.cache,RAW);NET='';
    if(JSON.stringify(Object.assign({},RAW,{lidoEm:''}))!==antes){recalcular();renderSeguro();}
    else{recalcular();}
  }).catch(function(e){NET='off';}).then(function(){setStatus();if(FILA.length)enviar();});
}
function enviar(){
  if(MODO!=='api'||enviando||!FILA.length)return;
  enviando=true;setStatus();
  var op=FILA[0];
  fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(op)})
    .then(function(r){return r.json();})
    .then(function(j){
      FILA.shift();jset(K.fila,FILA);
      if(j.dados){RAW=j.dados;jset(K.cache,RAW);}
      if(!j.ok)toast('Não foi salvo: '+(j.erro||'erro na planilha'),true);
      if(op.acao==='importar'&&j.ok)toast(j.mudancas&&j.mudancas.length?j.mudancas.length+' frequência(s) atualizada(s)':'Report importado, nenhuma frequência mudou');
      NET='';enviando=false;recalcular();renderSeguro();
      if(FILA.length)enviar();
    })
    .catch(function(){enviando=false;NET='off';setStatus();});
}
function fazer(op){
  op.por=QUEM||'';
  if(MODO==='demo'){aplicar(RAW,op);if(!jset(K.demo,RAW))toast('O navegador não deixou guardar esta alteração.',true);recalcular();render();return;}
  FILA.push(op);
  if(!jset(K.fila,FILA)&&op.acao==='foto'){FILA.pop();toast('Foto grande demais para guardar offline. Tente de novo com internet.',true);return;}
  recalcular();render();enviar();
}

function fotoGrande(p){

function epBar(){
  return '<div class="eps" role="group" aria-label="Episódio">'+D.eps.map(function(e){
    var s=situacao(e.ep);
    return '<button class="ep" type="button" data-act="ep" data-ep="'+e.ep+'" aria-pressed="'+(UI.ep===e.ep)+'"><b>EP '+e.ep+(s.graves?'<i class="dot" title="avisos"></i>':'')+'</b><span>'+contaEp(e.ep)+' pessoas</span></button>';
  }).join('')+'</div>';

function corDe(id){var c=D.capPor[id];return c&&/^(bege|preto|marrom)$/.test(c.cor)?c.cor:'';}
function bolinha(id){var c=corDe(id);return c?'<span class="cor '+c+'" title="'+c+'"></span>':'';}
function papelTxt(p){return {HOST:'host',MENTOR:'mentor',PARTICIPANTE:'participante',CONVIDADO:'convidado',FONTE:'fonte'}[p.papel]||p.papel.toLowerCase();}
function chips(av,max){
  var out=av.slice(0,max||9).map(function(a){return '<span class="chip '+a.k+'">'+esc(max&&a.c?a.c:a.t)+'</span>';}).join('');
  if(max&&av.length>max)out+='<span class="chip pend">+'+(av.length-max)+'</span>';
  return out;
}
function cardHtml(x){
  var p=x.p,e=x.e,t=x.t,bad=x.av.some(function(a){return a.k==='bad';});
  var sub=t?[t.nome,t.canal,isNaN(t.freq)?'':mhz(t.freq)].filter(Boolean).join(' · '):'';
  return '<button class="card'+(x.ativo?'':' fora')+(bad&&x.ativo?' bad':'')+'" type="button" data-act="abrir" data-id="'+esc(p.id)+'">'+
    fotoGrande(p)+'<span class="papel">'+esc(papelTxt(p))+(p.colinha?' · '+esc(p.colinha):'')+'</span>'+
    '<span class="bd"><span class="nm">'+esc(p.nome)+'</span>'+
    (x.ativo?'<span class="eq">'+(e&&e.tx?'<span class="tag">TX '+esc(e.tx)+'</span>':'<span class="tag vazio">TX –</span>')+
      (e&&e.cap?'<span class="tag cap '+corDe(e.cap)+'">'+esc(e.cap)+'</span>':'')+(e&&e.time?'<span class="chip pend">time '+esc(e.time)+'</span>':'')+'</span>'+
      (sub?'<span class="sub">'+esc(sub)+'</span>':'')+
      (x.av.length?'<span class="al">'+chips(x.av,2)+'</span>':'')
    :'<span class="sub">eliminado após o EP '+p.elim+'</span>')+
    '</span></button>';
}

function viewCar(){
  var s=situacao(UI.ep),h=epBar();
  var ep=D.eps.filter(function(e){return e.ep===UI.ep;})[0]||{};
  h+='<div class="sumario"><span><b>EP '+UI.ep+'</b>'+(ep.a||ep.b?' · equipes '+ep.a+' × '+ep.b:'')+(ep.data?' · '+esc(ep.data):'')+'</span>'+

    (s.avisos-s.graves?'<span class="chip warn">'+(s.avisos-s.graves)+' aviso(s)</span>':'')+
    (!s.avisos?'<span class="chip ok">tudo certo</span>':'')+'</div>';
  var grupos=[['Host e mentores',function(x){return x.ativo&&(x.p.papel==='HOST'||x.p.papel==='MENTOR');}],
    ['Participantes',function(x){return x.ativo&&(x.p.papel==='PARTICIPANTE'||x.p.papel==='CONVIDADO');}],
    ['Boom e gooseneck',function(x){return x.ativo&&x.p.papel==='FONTE';}],
    ['Fora do jogo',function(x){return !x.ativo;}]];
  grupos.forEach(function(g){

function ordenar(L,ordem){
  return L.slice().sort(function(a,b){
    if(ordem==='nome')return nat(a.p.nome,b.p.nome);
    if(ordem==='colinha')return nat(a.p.colinha||'99',b.p.colinha||'99')||(ORDEM_PAPEL[a.p.papel]-ORDEM_PAPEL[b.p.papel]);
    if(ordem==='canal'){var ia=a.t?int(a.t.input):99,ib=b.t?int(b.t.input):99;return ia-ib||nat(a.t?a.t.canal:'',b.t?b.t.canal:'');}
    var ta=a.e&&a.e.tx?(int(a.e.tx)||90):99,tb=b.e&&b.e.tx?(int(b.e.tx)||90):99;return ta-tb;
  });
}

function modCurta(m){var x=/\(([^)]+)\)/.exec(m||'');return x?x[1]:m;}
function txLivres(s){

/* ───────── report ───────── */
function decodificar(s){var t=document.createElement('textarea');t.innerHTML=s;return t.value;}
function lerReport(texto){
  var corte=texto.indexOf('SPECTRUM ANALYSIS'),h=corte>0?texto.slice(0,corte):texto.slice(0,400000);
  var g=h.match(/GENERATED\s+(\d{2})\.(\d{2})\.(\d{2})\s+(\d{2}:\d{2}(?::\d{2})?)/);
  var gerado=g?g[1]+'/'+g[2]+'/20'+g[3]+' '+g[4]:'';
  var itens=[],dev='';
  (h.match(/<tr[\s\S]*?<\/tr>/gi)||[]).forEach(function(tr){
    var td=(tr.match(/<td[^>]*>[\s\S]*?<\/td>/gi)||[]).map(function(x){return decodificar(x.replace(/<[^>]+>/g,'')).trim();});
    if(td.length>=9){dev=td[1];return;}
    if(td.length!==5)return;
    if(/^(yes|no)$/i.test(td[2])&&/^\d{3}\.\d+$/.test(td[3]))itens.push({nome:td[1],freq:parseFloat(td[3]),bloco:td[4],onde:'canal avulso'});
    else if(/^\d+$/.test(td[0])&&/^\d{3}\.\d+$/.test(td[2])&&td[4])itens.push({nome:td[4],freq:parseFloat(td[2]),bloco:td[1],onde:dev+' canal '+td[0]});
  });
  return {gerado:gerado,itens:itens};
}
function casar(rep){
  var por={};D.tx.forEach(function(t){if(t.wd)por[t.wd.toLowerCase()]=t;if(t.nome&&!por[t.nome.toLowerCase()])por[t.nome.toLowerCase()]=t;});
  var linhasP=[],nao=[];
  rep.itens.forEach(function(it){var t=por[it.nome.toLowerCase()];if(!t){nao.push(it.nome);return;}
    linhasP.push({tx:t.num,nome:t.nome,wd:it.nome,antes:t.freq,depois:it.freq,onde:it.onde,muda:!(Math.abs(t.freq-it.freq)<0.0005),rx:t.rx});});
  linhasP.sort(function(a,b){return (int(a.tx)||99)-(int(b.tx)||99);});
  return {gerado:rep.gerado,linhas:linhasP,nao:nao};
}

function reduzirFoto(file,cb){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){
    var lado=Math.min(im.width,im.height),alvo=Math.min(640,lado),c=document.createElement('canvas');c.width=alvo;c.height=alvo;
    c.getContext('2d').drawImage(im,(im.width-lado)/2,(im.height-lado)/2,lado,lado,0,0,alvo,alvo);
    cb(c.toDataURL('image/jpeg',0.84));};im.onerror=function(){toast('Não consegui abrir essa imagem.',true);};im.src=fr.result;};
  fr.readAsDataURL(file);
}

function cenaBase(){
  var p=[];for(var i=0;i<32;i++)p.push('');
  p[0]='P:RAMIRO';p[1]='P:TELMA';p[2]='P:SALADA';
  for(i=0;i<5;i++){p[3+i]='A:'+(i+1);p[8+i]='B:'+(i+1);p[16+i]='B:'+(i+1);}
  p[13]='P:BOOM';p[14]='P:GOOSENECK';
  D.elenco.forEach(function(x){var c=int(x.colinha);if(c>=23&&c<=32)p[c-1]='P:'+x.id;});
  return p;
}
function cenasPadrao(){
  var b=cenaBase(),it=b.slice();it[0]='P:GOOSENECK';it[14]='';
  return [{id:'base',nome:'Todos juntos',ordem:'alfa',pistas:b},{id:'interrog',nome:'Interrogatório',ordem:'alfa',pistas:it}];
}
function cenasCompartilhadas(){return D.cenas!==null;}
function cenasLista(){
  var L=cenasCompartilhadas()?D.cenas:jget(K.cenas,[]);
  L=(L||[]).filter(function(c){return c&&c.id&&Array.isArray(c.pistas);});
  var ord={base:0,interrog:1};L=L.slice().sort(function(x,y){return (ord[x.id]==null?9:ord[x.id])-(ord[y.id]==null?9:ord[y.id]);});
  return L.length?L:cenasPadrao();
}
function cenaAtual(){var L=cenasLista();return L.filter(function(c){return c.id===UI.cena;})[0]||L[0];}
function gravarCena(c,apagar){
  if(cenasCompartilhadas()){fazer({acao:'cena',id:c.id,nome:c.nome,ordem:c.ordem,pistas:JSON.stringify(c.pistas),apagar:!!apagar});return;}
  var L=(jget(K.cenas,[])||[]).filter(function(x){return x.id!==c.id;});
  if(!apagar)L.push(c);
  jset(K.cenas,L);
}
function salvarCena(c,apagar){
  var persistidas=cenasCompartilhadas()?D.cenas:(jget(K.cenas,[])||[]);
  if(!persistidas.length)cenasPadrao().forEach(function(x){if(x.id!==c.id)gravarCena(x);});
  gravarCena(c,apagar);
  if(!cenasCompartilhadas())render();
}
function semAcento(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'');}
function nomePista(p){
  if(!p)return '';
  if(p.pista)return semAcento(p.pista).toUpperCase();
  if(p.papel==='FONTE')return semAcento(p.nome).toUpperCase();
  return semAcento(p.nome.split(/\s+/)[0]).toUpperCase();
}
function corta16(s){return s.length<=8?s:s.slice(0,3)+'...'+s.slice(-4);}
function timeDe(ep,t,ordem){
  var EF=efetivo(ep);
  var L=D.elenco.filter(function(p){return ativo(p,ep)&&(p.papel==='PARTICIPANTE'||p.papel==='CONVIDADO')&&(EF[p.id]||{}).time===t;});
  return L.sort(function(a,b){
    if(ordem==='tx'){var x=int((EF[a.id]||{}).tx)||99,y=int((EF[b.id]||{}).tx)||99;return x-y;}
    return nat(a.nome,b.nome);
  });
}
function resolver(cena,ep){
  var EF=efetivo(ep),A=timeDe(ep,'A',cena.ordem),B=timeDe(ep,'B',cena.ordem),primeira={};
  var S=cena.pistas.map(function(tok,i){
    var s={n:i+1,tok:tok||'',p:null,motivo:''};
    if(!tok){return s;}
    var m=/^([PAB]):(.+)$/.exec(tok);if(!m)return s;
    if(m[1]==='P'){var p=D.pPor[m[2]];if(!p)s.motivo='não está no elenco';else if(!ativo(p,ep))s.motivo=p.nome+' saiu após o EP '+p.elim;else s.p=p;}
    else{var L=m[1]==='A'?A:B,k=int(m[2]);s.p=L[k-1]||null;if(!s.p)s.motivo='Time '+m[1]+' '+k+': ninguém';}
    if(s.p){var e=EF[s.p.id]||{};s.e=e;s.t=e.tx?D.txPor[e.tx]:null;
      if(primeira[s.p.id])s.copia=primeira[s.p.id];else primeira[s.p.id]=s.n;}
    return s;
  });
  return {S:S,A:A,B:B,EF:EF};
}
function rotuloTok(tok){
  if(!tok)return 'vazio';var m=/^([PAB]):(.+)$/.exec(tok);if(!m)return tok;
  if(m[1]==='P'){var p=D.pPor[m[2]];return p?p.nome:m[2];}
  return 'Time '+m[1]+' · '+m[2]+'º';
}
function avisosMix(R,ep){
  var W=[],S=R.S,EF=R.EF;
  var semTime=D.elenco.filter(function(p){return ativo(p,ep)&&(p.papel==='PARTICIPANTE'||p.papel==='CONVIDADO')&&!(EF[p.id]||{}).time;});
  if(semTime.length)W.push(['bad','Sem time marcado no Carômetro: '+semTime.map(function(p){return p.nome;}).join(', ')+'. Eles não entram nas pistas de time.']);
  var foraCL=S.filter(function(s){return s.n>=13&&s.n<=16&&s.p&&!s.copia;});
  if(foraCL.length)W.push(['warn','Fora do CL-12, só no iPad: '+foraCL.map(function(s){return 'Ch '+s.n+' '+nomePista(s.p);}).join(', ')+'.']);
  var naClara={};S.forEach(function(s){if(s.n>=17&&s.n<=22&&s.p)naClara[s.p.id]=1;});
  var faltam=R.B.filter(function(p){return !naClara[p.id];});
  if(faltam.length)W.push(['warn','A Clara não recebe (fora das pistas 17–22): '+faltam.map(function(p){return p.nome;}).join(', ')+'.']);
  var noMix={};S.forEach(function(s){if(s.n<=16&&s.p)noMix[s.p.id]=1;});
  var fora=R.A.concat(R.B).filter(function(p){return !noMix[p.id];});
  if(fora.length)W.push(['bad','Não estão em nenhuma pista de 1 a 16: '+fora.map(function(p){return p.nome;}).join(', ')+'.']);
  var cortes=S.filter(function(s){return s.p&&s.n<=22&&!s.copia&&nomePista(s.p).length>8;});
  if(cortes.length)W.push(['pend','Nomes cortados na visão de 16 faders: '+cortes.map(function(s){return nomePista(s.p)+' → '+corta16(nomePista(s.p));}).join(', ')+'. Toque na pista para encurtar.']);
  var vis={};S.forEach(function(s){if(s.p&&!s.copia){var k=nomePista(s.p);(vis[k]=vis[k]||[]).push(s.n);}});
  Object.keys(vis).forEach(function(k){if(vis[k].length>1)W.push(['bad','Nome de pista repetido: '+k+' (Ch '+vis[k].join(', ')+').']);});
  var vagos=S.filter(function(s){return s.tok&&!s.p&&s.n<=22;});
  if(vagos.length)W.push(['pend','Pistas vazias neste EP: '+vagos.map(function(s){return 'Ch '+s.n;}).join(', ')+'.']);
  return W;
}
function zonaDe(n){for(var i=0;i<ZONAS.length;i++)if(n>=ZONAS[i][0]&&n<=ZONAS[i][1])return i;return 0;}
function stripHtml(s,v){
  var p=s.p,nome=p?nomePista(p):'',estreito=v[0]==='s1'||v[0]==='s2'||v[0]==='all';
  var cap=s.n<=12?CAPS[s.n-1]:'';
  var cls='strip z'+zonaDe(s.n)+(MSEL===s.n?' sel':'')+(p?'':' vazio')+(s.copia?' copia':'')+(MTROCA&&MSEL&&MSEL!==s.n?' alvo':'');
  var sub=p?[s.t?'TX '+s.t.num:'sem TX',s.t&&s.t.canal?s.t.canal:''].filter(Boolean).join(' · '):(s.motivo||'');
  var out=s.n>=17&&s.n<=22?'<span class="xout">X'+(s.n-16)+' → 633·'+(s.n-16)+'</span>':'';
  return '<button type="button" class="'+cls+'" data-act="mslot" data-n="'+s.n+'" draggable="true" title="'+esc(p?p.nome:rotuloTok(s.tok))+'">'+
    '<span class="slab">'+(p?esc(estreito?corta16(nome):nome):'—')+'</span>'+
    '<span class="sph">'+(p?avatar(p):'')+'</span>'+
    '<span class="ssub">'+esc(s.copia?'= Ch '+s.copia:sub)+'</span>'+
    '<span class="strk"><span class="scap'+(cap?'':' sd')+'" style="'+(cap?'background:'+cap:'')+'"></span></span>'+out+
    '<span class="sfoot">Ch '+s.n+'</span></button>';
}
function linhaMix(R,a,b,v){
  var S=R.S.slice(a-1,b),cols=b-a+1,h='<div class="mrow" style="grid-template-columns:repeat('+cols+',var(--sw))">';
  [[1,12,'CL-12'],[13,32,'só iPad']].forEach(function(z){var x=Math.max(a,z[0]),y=Math.min(b,z[1]);if(x>y)return;
    h+='<span class="band ctl'+(z[0]===1?' cl':'')+'" style="grid-row:1;grid-column:'+(x-a+1)+' / span '+(y-x+1)+'">'+z[2]+'</span>';});
  ZONAS.forEach(function(z,i){var x=Math.max(a,z[0]),y=Math.min(b,z[1]);if(x>y)return;
    h+='<span class="band zb z'+i+'" style="grid-row:2;grid-column:'+(x-a+1)+' / span '+(y-x+1)+'">'+z[2]+'</span>';});
  S.forEach(function(s,i){h+='<span style="grid-row:3;grid-column:'+(i+1)+'">'+stripHtml(s,v)+'</span>';});
  return h+'</div>';
}
function painelSlot(R){
  if(!MSEL)return '<p class="hint">Toque numa pista para trocar o conteúdo, encurtar o nome ou mover. No computador, dá para arrastar uma pista sobre a outra para trocar.</p>';
  var c=cenaAtual(),s=R.S[MSEL-1],o='<option value="">Vazio</option>';
  o+='<optgroup label="Time A">'+[1,2,3,4,5].map(function(k){return '<option value="A:'+k+'"'+(s.tok==='A:'+k?' selected':'')+'>Time A · '+k+'º'+(R.A[k-1]?' ('+esc(R.A[k-1].nome)+')':'')+'</option>';}).join('')+'</optgroup>';
  o+='<optgroup label="Time B">'+[1,2,3,4,5].map(function(k){return '<option value="B:'+k+'"'+(s.tok==='B:'+k?' selected':'')+'>Time B · '+k+'º'+(R.B[k-1]?' ('+esc(R.B[k-1].nome)+')':'')+'</option>';}).join('')+'</optgroup>';
  o+='<optgroup label="Pessoa ou fonte fixa">'+D.elenco.map(function(p){return '<option value="P:'+esc(p.id)+'"'+(s.tok==='P:'+p.id?' selected':'')+'>'+esc(p.nome)+'</option>';}).join('')+'</optgroup>';
  var h='<div class="painel mpan"><div class="linha"><h3 style="margin:0">Ch '+MSEL+(MSEL<=12?' <span class="chip pend"><span class="cor" style="background:'+CAPS[MSEL-1]+'"></span>fader '+CAPNOME[MSEL-1]+'</span>':' <span class="chip pend">só no iPad</span>')+'</h3><span class="sp" style="flex:1"></span><button class="btn sm" type="button" data-act="mfechar">Fechar</button></div>';
  h+='<label class="campo" style="margin-top:.6rem">Conteúdo da pista<select data-act="mtok">'+o+'</select></label>';
  if(s.p)h+='<div class="linha" style="margin-top:.6rem"><label class="campo" style="flex:1">Nome de pista (vale em todas as cenas)<input type="text" id="mpista" maxlength="14" value="'+esc(nomePista(s.p))+'"></label><button class="btn" type="button" data-act="mpista" style="align-self:flex-end">Salvar nome</button></div>'+
    '<p class="hint" style="margin-top:.3rem">Na visão de 16 faders aparece como <b>'+esc(corta16(nomePista(s.p)))+'</b>.'+(s.copia?' Esta pista é cópia do Ch '+s.copia+' (mesmo input).':'')+'</p>';
  h+='<div class="linha" style="margin-top:.6rem"><button class="btn'+(MTROCA?' pri':'')+'" type="button" data-act="mtroca">'+(MTROCA?'Toque na pista de destino…':'⇄ Trocar de lugar')+'</button><button class="btn" type="button" data-act="mlimpa">Esvaziar pista</button></div></div>';
  return h;
}
function impressaoMix(R,c){
  var linhas=R.S.filter(function(s){return s.p||s.tok;}).map(function(s){var p=s.p;
    return '<tr><td><span class="tag sm">'+s.n+'</span></td><td class="n">'+esc(p?nomePista(p):'—')+'</td><td>'+esc(p?p.nome:(s.motivo||rotuloTok(s.tok)))+'</td><td>'+esc(s.t?'TX '+s.t.num:'')+'</td><td>'+esc(s.t?s.t.input:'')+'</td><td><b>'+esc(s.t?s.t.canal:'')+'</b></td><td>'+esc(s.copia?'cópia do Ch '+s.copia:'')+(s.n>=17&&s.n<=22?' X'+(s.n-16)+' → 633·'+(s.n-16):'')+'</td></tr>';}).join('');
  var fita='<div class="fita">'+R.S.slice(0,12).map(function(s){return '<span style="border-top:6px solid '+CAPS[s.n-1]+'">'+esc(s.p?nomePista(s.p):'')+'<i>'+s.n+'</i></span>';}).join('')+'</div>';
  return '<section class="doc soimpr"><div class="dochead"><div><h1>Cena · '+esc(c.nome)+'</h1><p>EP '+UI.ep+' · ordem nos times: '+(c.ordem==='tx'?'transmissor':'alfabética')+'</p></div><div class="r">Gerado em '+agora()+'</div></div>'+
    '<h3>Fita do CL-12</h3>'+fita+'<h3>Pistas do Scorpio</h3><div class="tabwrap"><table class="tab"><thead><tr><th>Ch</th><th>Nome de pista</th><th>Quem</th><th>TX</th><th>Input</th><th>Canal</th><th>Obs.</th></tr></thead><tbody>'+linhas+'</tbody></table></div></section>';
}
function viewMix(){
  var L=cenasLista(),c=cenaAtual(),R=resolver(c,UI.ep),v=MIXV.filter(function(x){return x[0]===UI.mixv;})[0]||MIXV[7];
  var h=epBar();
  if(!cenasCompartilhadas()&&MODO==='api')h+='<div class="banner">As cenas estão ficando só neste aparelho. Para salvar na planilha, atualize o Apps Script com o novo Codigo.gs (Implantar › Gerenciar implantações › Nova versão).</div>';
  h+='<div class="bar"><span class="seg" role="group" aria-label="Cena">'+L.map(function(x){return '<button type="button" data-act="mcena" data-v="'+esc(x.id)+'" aria-pressed="'+(x.id===c.id)+'">'+esc(x.nome)+'</button>';}).join('')+'</span>'+
    '<button class="btn sm" type="button" data-act="mnova">＋ Nova cena</button><button class="btn sm" type="button" data-act="mren">Renomear</button>'+(L.length>1?'<button class="btn sm dan" type="button" data-act="mdel">Excluir</button>':'')+'</div>';
  h+='<div class="bar"><span class="seg" role="group" aria-label="Visão">'+MIXV.map(function(x){return '<button type="button" data-act="mview" data-v="'+x[0]+'" aria-pressed="'+(x[0]===v[0])+'">'+x[1]+'</button>';}).join('')+'</span>'+
    '<label class="campo" style="display:flex;align-items:center;gap:.4rem">Ordem nos times <select data-act="mordem"><option value="alfa"'+(c.ordem!=='tx'?' selected':'')+'>Alfabética</option><option value="tx"'+(c.ordem==='tx'?' selected':'')+'>Transmissor</option></select></label>'+
    '<span class="sp"></span><button class="btn sm" type="button" data-act="mreset">Restaurar estrutura base</button><button class="btn pri sm" type="button" data-act="print">Imprimir</button></div>';
  h+='<div class="console">';
  if(v[0]==='all')h+=linhaMix(R,1,16,v)+linhaMix(R,17,32,v);else h+=linhaMix(R,v[2],v[3],v);
  h+='</div>';
  var W=avisosMix(R,UI.ep);
  h+='<div class="alertas noprint" style="margin-top:.8rem">'+(W.length?W.map(function(w){return '<div class="alerta '+w[0]+'">'+esc(w[1])+'</div>';}).join(''):'<div class="alerta ok">Tudo no lugar para o EP '+UI.ep+'.</div>')+'</div>';
  h+='<div class="noprint">'+painelSlot(R)+'</div>';
  h+='<p class="hint noprint">Rtn B (mix da Clara vindo do 633) não ocupa pista: monitore pelo botão RTN B do CL-12.</p>';
  return h+impressaoMix(R,c);
}
function mudarPista(n,tok){var c=clone(cenaAtual());c.pistas[n-1]=tok;salvarCena(c);}
function trocarPistas(a,b){if(a===b)return;var c=clone(cenaAtual()),t=c.pistas[a-1];c.pistas[a-1]=c.pistas[b-1];c.pistas[b-1]=t;salvarCena(c);}
function cliqueMix(a,el){
  var c;
  if(a==='mslot'){var n=+el.dataset.n;if(MTROCA&&MSEL&&MSEL!==n){trocarPistas(MSEL,n);MSEL=n;MTROCA=false;render();return true;}MSEL=MSEL===n?0:n;MTROCA=false;render();return true;}
  if(a==='mfechar'){MSEL=0;MTROCA=false;render();return true;}
  if(a==='mtroca'){MTROCA=!MTROCA;render();return true;}
  if(a==='mlimpa'){mudarPista(MSEL,'');return true;}
  if(a==='mcena'){UI.cena=el.dataset.v;MSEL=0;salvarUi();render();return true;}
  if(a==='mview'){UI.mixv=el.dataset.v;salvarUi();render();return true;}
  if(a==='mreset'){if(confirm('Voltar esta cena para a estrutura base (fixos, Time A 4–8, Time B 9–13, Clara 17–21, colinha)?')){c=clone(cenaAtual());c.pistas=cenaBase();salvarCena(c);}return true;}
  if(a==='mnova'){var nome=prompt('Nome da nova cena (ex.: QG equipes separadas):');if(!nome)return true;c=clone(cenaAtual());c.id='c'+Date.now().toString(36);c.nome=nome.trim();
    salvarCena(c);UI.cena=c.id;salvarUi();render();return true;}
  if(a==='mren'){c=clone(cenaAtual());var nn=prompt('Novo nome da cena:',c.nome);if(nn){c.nome=nn.trim();salvarCena(c);}return true;}
  if(a==='mdel'){c=cenaAtual();if(confirm('Excluir a cena "'+c.nome+'"?')){salvarCena(c,true);UI.cena='';salvarUi();render();}return true;}
  if(a==='mpista'){var s=resolver(cenaAtual(),UI.ep).S[MSEL-1];if(s&&s.p){fazer({acao:'pessoa',id:s.p.id,pista:semAcento($('#mpista').value.trim()).toUpperCase()});toast('Nome de pista salvo');}return true;}
  return false;
}
function mudancaMix(a,el){
  if(a==='mtok'){mudarPista(MSEL,el.value);return true;}
  if(a==='mordem'){var c=clone(cenaAtual());c.ordem=el.value;salvarCena(c);return true;}
  return false;
}
var mDrag=0;
document.addEventListener('dragstart',function(ev){var el=ev.target.closest&&ev.target.closest('[data-act=mslot]');if(!el)return;mDrag=+el.dataset.n;try{ev.dataTransfer.setData('text/plain',String(mDrag));ev.dataTransfer.effectAllowed='move';}catch(e){}});
document.addEventListener('dragover',function(ev){if(mDrag&&ev.target.closest&&ev.target.closest('[data-act=mslot]'))ev.preventDefault();});
document.addEventListener('drop',function(ev){var el=ev.target.closest&&ev.target.closest('[data-act=mslot]');if(!el||!mDrag)return;ev.preventDefault();var n=+el.dataset.n;trocarPistas(mDrag,n);MSEL=n;mDrag=0;render();});
document.addEventListener('dragend',function(){mDrag=0;});

/* ───────── render ───────── */
function render(){
  $('#nav').innerHTML=VIEWS.map(function(v){return '<button type="button" data-act="view" data-v="'+v[0]+'"'+(UI.view===v[0]?' aria-current="page"':'')+'>'+v[1]+'</button>';}).join('');
  if(!D||!D.tx.length&&!D.elenco.length){
    $('#app').innerHTML=MODO==='api'?'<div class="banner">Carregando dados da planilha…</div>':'<div class="banner">Sem dados.</div>';
    if(UI.view==='tec')$('#app').innerHTML+=viewTec();
    setStatus();return;
  }
  if(!D.eps.some(function(e){return e.ep===UI.ep;}))UI.ep=1;
  var pre=MODO==='demo'&&UI.view!=='tec'?'<div class="banner">Modo demonstração com dados de exemplo. Para ligar na planilha, abra a aba Técnico.</div>':'';
  if(MODO==='api'&&NET==='off')pre='<div class="banner err">Sem conexão. Mostrando os dados de '+esc(D.lidoEm||'—')+(FILA.length?'; '+FILA.length+' alteração(ões) serão enviadas quando a conexão voltar':'')+'.</div>';
  $('#app').innerHTML=pre+({car:viewCar,doc:viewDoc,mix:viewMix,dev:viewDev,tec:viewTec}[UI.view]||viewCar)();
  if(EDIT)renderModal();
  setStatus();
}
function renderSeguro(){
  var a=document.activeElement;
  if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.type!=='checkbox'){renderSeguro.pend=true;return;}
  render();
}
document.addEventListener('focusout',function(){setTimeout(function(){if(renderSeguro.pend){var a=document.activeElement;if(!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))){renderSeguro.pend=false;render();}}},80);});

/* ───────── eventos ───────── */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,v=el.dataset.v;
  if(el.tagName==='INPUT'||el.tagName==='SELECT')return;
  if(cliqueMix(a,el))return;
  if(a==='fecharfora'){if(ev.target===el)fechar();return;}
  if(a==='view'){UI.view=v;salvarUi();render();window.scrollTo(0,0);}
  else if(a==='ep'){UI.ep=+el.dataset.ep;salvarUi();render();}
  else if(a==='abrir')abrir(el.dataset.id);
  else if(a==='fechar')fechar();
  else if(a==='sync'){if(MODO==='api')buscar();else{UI.view='tec';render();}}
  else if(a==='tx'||a==='cap'||a==='time'){var op={acao:'escalar',ep:UI.ep,id:EDIT};op[a]=v;fazer(op);renderModal();}
  else if(a==='obs'){fazer({acao:'escalar',ep:UI.ep,id:EDIT,obs:$('#obs').value.trim()});renderModal();toast('Observação salva');}
  else if(a==='ajustado'){fazer({acao:'ajustado',tx:el.dataset.tx,valor:true});renderModal();}
  else if(a==='desfazerelim'){fazer({acao:'eliminar',id:EDIT,ep:''});renderModal();}
  else if(a==='fmt'){UI.fmt=v;salvarUi();render();}
  else if(a==='print')window.print();
  else if(a==='quem'){QUEM=$('#quem').value.trim();jset(K.quem,QUEM);toast('Nome salvo');}
  else if(a==='api'){var u=$('#api').value.trim();if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){toast('O endereço precisa começar com https://script.google.com e terminar em /exec.',true);return;}
    API=u;jset(K.api,API);MODO='api';RAW=null;FILA=[];jset(K.fila,FILA);recalcular();render();buscar();}
  else if(a==='desconectar'){if(FILA.length&&!confirm('Há alterações ainda não enviadas. Desconectar mesmo assim?'))return;
    API='';jset(K.api,'');MODO='demo';FILA=[];jset(K.fila,FILA);RAW=jget(K.demo,null)||clone(DEMO);recalcular();render();}
  else if(a==='copiar'){var c=$('#convite');c.select();if(navigator.clipboard)navigator.clipboard.writeText(c.value);toast('Link copiado');}
  else if(a==='resetdemo'){if(confirm('Apagar as alterações da demonstração?')){try{localStorage.removeItem(K.demo);}catch(e){}RAW=clone(DEMO);recalcular();render();}}
  else if(a==='confirmarreport'){var P=PREVIEW;PREVIEW=null;
    fazer({acao:'importar',gerado:P.gerado,itens:P.linhas.map(function(l){return {tx:l.tx,freq:l.depois};}),naoCasados:P.nao});
    if(MODO==='demo')toast('Report importado');}
  else if(a==='cancelarreport'){PREVIEW=null;render();}
});
document.addEventListener('change',function(ev){
  var el=ev.target,a=el.dataset.act;
  if(mudancaMix(a,el))return;
  if(a==='ordem'){UI.ordem=el.value;salvarUi();render();}
  else if(a==='elim'){fazer({acao:'eliminar',id:EDIT,ep:el.checked?UI.ep:''});renderModal();}
  else if(a==='foto'&&el.files[0]){var id=EDIT;reduzirFoto(el.files[0],function(url){fazer({acao:'foto',id:id,base64:url.split(',')[1],mime:'image/jpeg',preview:url});renderModal();toast('Foto salva');});}
  else if(a==='report'&&el.files[0]){
    var f=el.files[0];
    f.slice(0,600000).text().then(function(t){
      var rep=lerReport(t);
      if(!rep.itens.length){toast('Não achei a tabela de frequências nesse arquivo.',true);return;}
      PREVIEW=casar(rep);render();
    });
  }
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&EDIT)fechar();});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&MODO==='api')buscar();});

/* ───────── início ───────── */
recalcular();render();
if(MODO==='api'){buscar();setInterval(function(){if(!document.hidden&&!EDIT)buscar();else if(FILA.length)enviar();},30000);}
window.__plc={lerReport:lerReport,casar:casar,situacao:situacao,get D(){return D;},fazer:fazer,UI:UI,render:render,abrir:abrir};
})();
