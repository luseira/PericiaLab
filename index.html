<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181d">
<title>Perícia Lab · Carômetro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15181d; --ink2:#50565f; --ink3:#878d96; --line:#d3d7dd; --bg:#e9ebee; --paper:#fff;
  --tag:#f4c20d; --accent:#0a6d83; --accent-ink:#fff;
  --bad:#b3261e; --badbg:#fde4e1; --warn:#8a5a00; --warnbg:#fff1cc; --pend:#4d535b; --pendbg:#eceef1;
  --ok:#1d6b34; --okbg:#dcf2e2;
  --f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fc:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--f)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* topo */
.top{background:var(--ink);color:#fff;padding:.65rem 1rem .55rem;border-bottom:4px solid var(--tag);display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.top h1{margin:0;font:700 1.5rem/1 var(--fc);letter-spacing:.02em}
.top small{display:block;color:#aeb4bd;font-size:.76rem;margin-top:.15rem}
.top .sp{flex:1}
.pill{border:1px solid #5c636d;color:#dfe3e8;border-radius:999px;padding:.25rem .75rem;font-size:.8rem;background:transparent;white-space:nowrap}
.pill.ok{border-color:#6fbf73;color:#c4ebc6}
.pill.err{border-color:#e0786f;color:#ffcbc6}
.pill.demo{border-color:var(--tag);color:#ffe28a}
.nav{display:flex;gap:.2rem;padding:.4rem 1rem 0;overflow-x:auto;background:var(--bg);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:.55rem .8rem;font-weight:500;color:var(--ink2);white-space:nowrap}
.nav button[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}

main{padding:1rem;max-width:1400px;margin:0 auto}
h2{font:700 1.35rem/1.1 var(--fc);margin:0 0 .5rem;letter-spacing:.01em}
h3{font:700 1.1rem/1.1 var(--fc);margin:1.3rem 0 .45rem;letter-spacing:.01em}
.hint{color:var(--ink2);margin:.1rem 0 .8rem;font-size:.88rem;max-width:72ch}
.banner{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:.6rem .8rem;margin:0 0 1rem;font-size:.88rem}
.banner.err{background:var(--badbg);color:var(--bad)}

/* episódios */
.eps{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem;margin-bottom:.9rem}
.ep{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.35rem .7rem;text-align:left;min-width:4.6rem;flex:none}
.ep b{display:block;font:700 1.1rem/1 var(--fc)}
.ep span{font-size:.72rem;color:var(--ink2)}
.ep[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.ep[aria-pressed=true] span{color:#b9bfc7}
.ep .dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:var(--bad);margin-left:.25rem;vertical-align:middle}

.chip{font:inherit}button.chip{cursor:pointer;border:0}
.avpainel{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:.6rem .7rem;margin:0 0 .9rem}
.avhd{display:flex;gap:.4rem;align-items:center;margin-bottom:.4rem;flex-wrap:wrap}
.avit{display:flex;gap:.6rem;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:.4rem .1rem;cursor:pointer}
.avit b{min-width:5.5rem}.avit span{display:flex;flex-wrap:wrap;gap:.2rem .7rem;font-size:.84rem}
.avit i{font-style:normal}.avit i.bad{color:#b3261e}.avit i.warn,.avit i.pend{color:var(--ink2)}
.sumario{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:-.2rem 0 .9rem;font-size:.86rem;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:.25rem;border-radius:999px;padding:.08rem .55rem;font-size:.76rem;font-weight:600;white-space:nowrap}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.pend{background:var(--pendbg);color:var(--pend)}
.chip.ok{background:var(--okbg);color:var(--ok)}

/* carômetro */
.grupo{margin:0 0 1.3rem}
.grupo>h3{margin:0 0 .5rem;display:flex;align-items:baseline;gap:.5rem}
.grupo>h3 small{font:500 .8rem var(--f);color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;text-align:left;position:relative;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.12)}
.card:active{transform:scale(.985)}
.card .ft{aspect-ratio:4/3;position:relative;display:grid;place-items:center;color:#fff;font:700 2.6rem/1 var(--fc);overflow:hidden}
.card .ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .bd{padding:.5rem .6rem .6rem;display:flex;flex-direction:column;gap:.3rem;flex:1}
.card .nm{font:700 1.3rem/1.02 var(--fc);text-transform:uppercase;letter-spacing:.015em;overflow-wrap:anywhere}
.card .eq{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.card .sub{font-size:.76rem;color:var(--ink2)}
.card .al{display:flex;gap:.25rem;flex-wrap:wrap}
.card .al .chip{white-space:normal;line-height:1.25;padding:.12rem .5rem}
.card.bad{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.card.fora{filter:grayscale(1);opacity:.55}
.card.fora .nm{text-decoration:line-through;text-decoration-thickness:2px}
.card .papel{position:absolute;top:.4rem;left:.4rem;background:rgba(21,24,29,.82);color:#fff;font:600 .66rem/1 var(--f);letter-spacing:.05em;padding:.28rem .45rem;border-radius:4px;text-transform:uppercase}
.card .col{position:absolute;top:.4rem;right:.4rem}
.tag{display:inline-grid;place-items:center;min-width:2.4rem;height:1.75rem;padding:.15rem .4rem 0;background:var(--tag);color:var(--ink);font:700 1.15rem/1 var(--fc);border-radius:4px;white-space:nowrap}
.tag.vazio{background:var(--pendbg);color:var(--ink3)}
.tag.cap{background:var(--ink);color:#fff;font-size:.95rem}
.tag.cap.bege{background:#d8c3a2;color:#2a2116}
.tag.cap.marrom{background:#6a4630;color:#fff}
.cor{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;vertical-align:-1px;margin-right:.3rem;border:1px solid rgba(0,0,0,.3);flex:none}
.cor.bege{background:#d8c3a2}.cor.preto{background:#15181d}.cor.marrom{background:#6a4630}
.tag.sm{height:1.4rem;min-width:1.9rem;font-size:.95rem}
.av{position:relative;display:inline-grid;place-items:center;border-radius:50%;color:#fff;font:700 1rem/1 var(--fc);overflow:hidden;flex:none;width:2.4rem;height:2.4rem}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* editor */
.ov{position:fixed;inset:0;background:rgba(10,12,15,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:760px){.ov{align-items:center;padding:1.5rem}}
.sheet{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media(min-width:760px){.sheet{border-radius:14px;max-height:88vh}}
.sh-hd{position:sticky;top:0;background:var(--paper);display:flex;gap:.8rem;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--line);z-index:1}
.sh-hd .av{width:3.6rem;height:3.6rem;border-radius:10px;font-size:1.6rem}
.sh-hd h2{margin:0;font-size:1.8rem;text-transform:uppercase}
.sh-hd .sp{flex:1}
.sh-hd .x{background:var(--pendbg);border:0;border-radius:999px;width:2.4rem;height:2.4rem;font-size:1.3rem;line-height:1}
.sh-bd{padding:.8rem 1rem 1.4rem}
.sh-bd h3:first-child{margin-top:.2rem}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:.45rem}
.opt{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:.45rem .55rem;text-align:left;display:flex;flex-direction:column;gap:.1rem;min-height:3.6rem}
.opt b{font:700 1.15rem/1 var(--fc)}
.opt b i{font-style:normal;background:var(--tag);border-radius:3px;padding:.05rem .3rem;margin-right:.3rem}
.opt span{font-size:.74rem;color:var(--ink2)}
.opt[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.opt[aria-pressed=true] span{color:#c6cbd2}
.opt[aria-pressed=true] b i{color:var(--ink)}
.opt:disabled{opacity:.42;cursor:not-allowed;background:var(--pendbg)}
.opt.cap-bege{background:#d8c3a2;border-color:#bfa87f;color:#2a2116}.opt.cap-bege span{color:#5a4a33}
.opt.cap-preto{background:#262a30;border-color:#3a3f47;color:#fff}.opt.cap-preto span{color:#c6cbd2}
.opt.cap-marrom{background:#6a4630;border-color:#563826;color:#fff}.opt.cap-marrom span{color:#e0cdbd}
.opt[class*=cap-][aria-pressed=true]{outline:3px solid var(--ink);outline-offset:1px}
.opt.comad{border-style:dashed}
.opt.limpar{justify-content:center;align-items:center;color:var(--ink2);border-style:dashed}
.det{display:grid;grid-template-columns:auto 1fr;gap:.25rem .9rem;margin:.2rem 0;font-size:.92rem}
.det dt{color:var(--ink2)}
.det dd{margin:0;font-weight:600}
.alertas{display:flex;flex-direction:column;gap:.4rem;margin:.2rem 0 .4rem}
.alerta{border-radius:8px;padding:.55rem .7rem;font-size:.88rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.alerta.bad{background:var(--badbg);color:var(--bad)}
.alerta.warn{background:var(--warnbg);color:var(--warn)}
.alerta.pend{background:var(--pendbg);color:var(--pend)}
.alerta .sp{flex:1}
.linha{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.btn{background:var(--paper);border:1px solid var(--ink2);border-radius:7px;padding:.45rem .85rem;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dan{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:.25rem .6rem;font-size:.84rem}
.seg{display:inline-flex;border:1px solid var(--ink2);border-radius:7px;overflow:hidden}
.seg button{background:var(--paper);border:0;padding:.4rem .85rem;font-weight:600;border-left:1px solid var(--line)}
.seg{max-width:100%;overflow-x:auto}
.seg button{white-space:nowrap;flex:none}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
input[type=text],input[type=url],select{background:#fff;border:1px solid var(--line);border-radius:7px;padding:.45rem .6rem;min-height:2.4rem}
label.campo{display:block;font-size:.8rem;color:var(--ink2);font-weight:500}
label.campo input,label.campo select{display:block;width:100%;margin-top:.15rem;color:var(--ink);font-size:.95rem}
.toggle{display:flex;gap:.6rem;align-items:center;background:var(--pendbg);border-radius:8px;padding:.6rem .7rem;font-weight:600}
.toggle input{width:1.3rem;height:1.3rem;accent-color:var(--bad)}

/* documento */
.bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin:.1rem 0 1rem}
.bar .sp{flex:1}
.doc{background:var(--paper);border:1px solid var(--line);padding:1.1rem 1.2rem;border-radius:4px}
.dochead{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;border-bottom:3px solid var(--ink);padding-bottom:.5rem;margin-bottom:.9rem}
.dochead h1{margin:0;font:700 1.8rem/1 var(--fc)}
.dochead p{margin:.25rem 0 0;color:var(--ink2);font-weight:600}
.dochead .r{text-align:right;font-size:.78rem;color:var(--ink2)}
.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.7rem}
.ficha{border:1.5px solid var(--ink);border-radius:5px;display:grid;grid-template-columns:88px 1fr;overflow:hidden;break-inside:avoid;background:#fff}
.ficha .ft{position:relative;display:grid;place-items:center;color:#fff;font:700 2rem/1 var(--fc);min-height:100%}
.ficha .ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ficha .bd{padding:.45rem .55rem}
.ficha .hd{display:flex;gap:.45rem;align-items:center;margin-bottom:.3rem;min-width:0}
.ficha .hd .tag{flex:none}
.ficha .hd>div{min-width:0}
.ficha h4{margin:0;font:700 1.25rem/1 var(--fc);text-transform:uppercase;overflow-wrap:anywhere}
.ficha .sub{font-size:.72rem;color:var(--ink2)}
.ficha dl{display:grid;grid-template-columns:auto 1fr;gap:.05rem .55rem;margin:0;font-size:.8rem}
.ficha dt{color:var(--ink2)}
.ficha dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.ficha .nota{grid-column:1/-1;margin-top:.25rem;font-size:.72rem;color:var(--ink2);border-top:1px solid var(--line);padding-top:.2rem}
table.tab{border-collapse:collapse;width:100%;font-size:.84rem}
table.tab th{background:var(--ink);color:#fff;font-weight:600;text-align:left;padding:.35rem .45rem;font-size:.74rem;white-space:nowrap}
table.tab td{border-bottom:1px solid var(--line);padding:.32rem .45rem;vertical-align:middle;white-space:nowrap}
table.tab td.n,table.tab td.w{white-space:normal}
table.tab td.n{font-weight:700;text-transform:uppercase;font-family:var(--fc);font-size:1rem}
table.tab tr{break-inside:avoid}
table.tab tr.mentor td{background:#f6f7f9;color:var(--ink2);font-size:.78rem}
.tabwrap{overflow-x:auto}
.livres{margin-top:.8rem;font-size:.8rem;color:var(--ink2)}
.quebra{margin-top:1.2rem}

.painel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem;max-width:56rem}
.painel h3{margin-top:0}
pre{background:#14171c;color:#d6dae0;padding:.8rem;border-radius:6px;overflow:auto;font-size:.78rem;max-height:18rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:8px;z-index:40;font-size:.9rem;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.err{background:var(--bad)}


/* mixer */
.console{--sw:74px;background:#1b1d21;border-radius:12px;padding:.7rem .7rem .9rem;overflow-x:auto;box-shadow:inset 0 0 0 1px #2c2f35}
.mrow{display:grid;gap:4px 6px;margin-bottom:.9rem;width:max-content}
.mrow:last-child{margin-bottom:0}
.band{margin-bottom:4px;font:600 .66rem/1 var(--f);letter-spacing:.05em;text-transform:uppercase;padding:.3rem .45rem;border-radius:4px;color:#d7dbe0;white-space:nowrap;overflow:hidden}
.band.ctl{background:#2a2d33;color:#9aa1ab}
.band.ctl.cl{background:#5e5034;color:#e6d9bd}
.band.zb.z0{background:#3a3f48}.band.zb.z1{background:#2e3a4c}.band.zb.z2{background:#4b2f45}.band.zb.z3{background:#2b2f36}.band.zb.z4{background:#2f3a33}
.dawbox{background:#1f2227;border:1px solid #3a3f48;border-radius:8px;padding:.5rem .6rem;margin:.6rem 0;max-width:34rem;color:#e8eaee}
.dawbox summary{cursor:pointer;font:600 .78rem var(--f);color:#c9ced6;list-style:none}.dawbox summary::-webkit-details-marker{display:none}.dawbox summary::before{content:'▾ ';color:#8d939d}.dawbox:not([open]) summary::before{content:'▸ '}.dawbox summary b{color:#fff}.dawbox[open] summary{margin-bottom:.35rem}
.dawlanes{display:flex;flex-direction:column;gap:2px}
.dl{--lc:#6b7280;display:grid;grid-template-columns:1.3rem 7.2rem 2.6rem 1fr;align-items:center;height:1.1rem;background:#2a2d33;border-radius:3px;font-size:.7rem;overflow:hidden}
.dl .dn{text-align:center;color:#8d939d;font-weight:700}.dl .dt{font:700 .74rem var(--fc);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:.3rem}.dl .dc{color:#8d939d}
.dl .clip{height:100%;background:linear-gradient(90deg,transparent 0 2px,var(--lc) 2px);opacity:.85;position:relative;border-radius:2px;
 -webkit-mask:repeating-linear-gradient(90deg,#000 0 3px,rgba(0,0,0,.55) 3px 4px);mask:repeating-linear-gradient(90deg,#000 0 3px,rgba(0,0,0,.55) 3px 4px)}
.dl.k-host{--lc:var(--c-host,#c9a227)}.dl.k-mentor{--lc:var(--c-mentor,#8e5cc4)}.dl.k-tv{--lc:var(--c-A,#d0362b)}.dl.k-tz{--lc:var(--c-B,#2e6fd6)}
.dl.k-boom{--lc:var(--c-boom,#2aa198)}.dl.k-goose{--lc:var(--c-goose,#8a9a2e)}.dl.k-mix{--lc:#d9822b}.dl.k-bus{--lc:#4fa3c7}.dl.k-fonte{--lc:#8a8f98}
.strip{user-select:none;-webkit-user-select:none;width:var(--sw);height:236px;background:#26292e;border:1px solid #34383f;border-radius:7px;display:flex;flex-direction:column;align-items:center;padding:.3rem .25rem;gap:.25rem;color:#e9ecef;position:relative;cursor:pointer}
.strip.k-host{background:#3b3524;border-color:#5a5034}.strip.k-mentor{background:#33293f;border-color:#4f3f61}
.strip.k-tv{background:#3c2527;border-color:#5e383b}.strip.k-tz{background:#223049;border-color:#344a6e}
.strip.k-boom{background:#1f3a39;border-color:#305957}.strip.k-goose{background:#363a22;border-color:#545a35}
.mleg{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.76rem;color:var(--ink2);margin:.45rem 0 0}
.mleg i{display:inline-block;width:.8rem;height:.8rem;border-radius:2px;margin-right:.3rem;vertical-align:-1px}
.strip .slab{width:100%;background:#0e0f11;border-radius:4px;font:700 .82rem/1 var(--fc);letter-spacing:.02em;padding:.35rem .15rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:clip}
.strip .sph .av{width:2rem;height:2rem;font-size:.8rem}
.strip .sph{height:2rem}
.strip .ssub{font-size:.6rem;color:#a9b0b9;text-align:center;line-height:1.15;height:2.1rem;overflow:hidden;flex:none}
.strip .slab,.strip .sph,.strip .sfoot{flex:none}
.strip .strk{flex:1;width:6px;background:#0b0c0e;border-radius:3px;position:relative;margin:.15rem 0}
.strip .scap{position:absolute;left:50%;top:38%;width:30px;height:22px;transform:translateX(-50%);border-radius:3px;box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 -3px 0 rgba(0,0,0,.25)}
.strip .scap.sd{background:#e2b254;width:22px;height:34px;border:2px solid #fff;border-radius:4px}
.strip .sfoot{font:600 .74rem/1 var(--f);background:#0e0f11;border-radius:4px;width:100%;text-align:center;padding:.3rem 0}
.strip .xout{position:absolute;bottom:2rem;left:0;right:0;text-align:center;font-size:.58rem;color:#f0b8e0}
.strip.vazio{opacity:.45}
.strip.off{opacity:.42;filter:saturate(.5)}
.strip.off .scap{filter:brightness(.6)}
.strip.vazio .slab{color:#6c727b}
.strip.copia{border-style:dashed}
.strip.sel{outline:3px solid var(--tag);outline-offset:1px}
.strip.alvo:hover{outline:2px dashed var(--tag)}
.mpan{margin-top:.9rem;max-width:40rem}
.alerta.ok{background:var(--okbg);color:var(--ok)}
.fita{display:grid;grid-template-columns:repeat(12,1fr);border:1px solid #000}
.fita span{border-right:1px solid #000;padding:.3rem .2rem;text-align:center;font:700 .8rem/1.1 var(--fc);text-transform:uppercase;min-height:2.6rem;display:flex;flex-direction:column;justify-content:space-between}
.fita span i{font-style:normal;font:500 .62rem var(--f);color:#555}
.soimpr{display:none}

/* rodada 1 */
.inv{display:inline-grid;place-items:center;width:1.35rem;height:1.35rem;border-radius:50%;background:#7a1fa2;color:#fff;font:700 .85rem/1 var(--f);flex:none;vertical-align:middle}
.inv.sm{width:1.05rem;height:1.05rem;font-size:.68rem}
.chip.tv{background:#fbe0dd;color:#a3221a}.chip.tz{background:#dbe6fb;color:#1d4597}
.seg button.tv[aria-pressed=true]{background:#c62f24}.seg button.tz[aria-pressed=true]{background:#2456c2}
.card .ligacao{display:flex;gap:.35rem;align-items:baseline;flex-wrap:wrap}

/* ───────── códigos e grade de frequência ───────── */
/* Lectrosonics: código hex = (freq − 25,6 × bloco) ÷ 100 kHz, com ¼ ½ ¾ para os passos de 25 kHz.
   Sony UTX (600 MHz): canal de TV + passos de 125 kHz desde o início do canal (canal 14 = 470 MHz, 6 MHz cada). */
var LECTRO=/^(SMQV|SMa|SSM|DBSMD|SMDB|SMWB|SMV|UM400|UM200|LT|DBu|HMa|HHa)/i, SONY=/UTX|SONY/i;
function gradeTx(t,f){
  var r={ok:true,cod:'',msg:''};if(!t||isNaN(f))return r;
  var khz=Math.round(f*1000),passo=int(t.passo)||(SONY.test(t.modelo)?125:25);
  if(khz%passo){r.ok=false;var a=(khz-khz%passo)/1000,b=a+passo/1000;r.msg='fora da grade de '+passo+' kHz (vizinhos '+mhz(a)+' e '+mhz(b)+')';}
  var fx=/([\d.,]+)\s*a\s*([\d.,]+)/.exec(t.faixa||'');
  if(fx){var lo=num(fx[1]),hi=num(fx[2]);if(f<lo-1e-6||f>hi+1e-6){r.ok=false;r.msg=(r.msg?r.msg+'; ':'')+'fora da faixa '+t.faixa+' MHz';}}
  if(LECTRO.test(t.modelo)){
    var blk=Math.floor((khz+1e-6)/25600),k=khz-blk*25600,c=Math.floor(k/100),rest=k%100;
    if(c>=0&&c<256&&rest%25===0){r.cod=('0'+c.toString(16).toUpperCase()).slice(-2)+({0:'',25:'¼',50:'½',75:'¾'}[rest]);
      if(!/^\d+$/.test(String(t.bloco)))r.cod+=' · b '+blk;}
  }else if(SONY.test(t.modelo)){
    var ch=Math.floor((khz-470000)/6000)+14,ini=470000+(ch-14)*6000;
    if((khz-470000)%125===0&&ch>=14){
      /* o Sony continua contando no canal anterior (ex.: 5040 = 691,000): usa o canal que dá o menor número */
      var n=(khz-ini)/125;r.cod=ch+('0'+n).slice(-2);}
  }
  return r;
}

/* aplica uma alteração sobre os dados crus (modo demonstração e alterações ainda na fila) */
function aplicar(R,op){
  var i,o;
  if(op.acao==='escalar'){
    var achou=null;
    for(i=R.esc.length-1;i>=0;i--)if(int(R.esc[i]['EP'])===op.ep&&str(R.esc[i]['ID'])===op.id){achou=R.esc[i];break;}
    if(!achou){
      var ef=efetivoCru(R,op.ep)[op.id]||{};
      achou={'EP':op.ep,'ID':op.id,'Nome':'','TX':ef.tx||'','Cápsula':ef.cap||'','Time':ef.time||'','Observações':ef.obs||''};
      R.esc.push(achou);
    }
    ['tx','cap','time','obs'].forEach(function(k){if(op[k]!==undefined)achou[{tx:'TX',cap:'Cápsula',time:'Time',obs:'Observações'}[k]]=op[k];});
    achou['Atualizado em']=agora();achou['Por']=op.por||'';
  }else if(op.acao==='eliminar'){
    R.elenco.forEach(function(p){if(str(p['ID'])===op.id)p['Eliminado após EP']=op.ep||'';});
  }else if(op.acao==='ajustado'){
    R.tx.forEach(function(t){if(str(t['TX'])===String(op.tx))t['Aparelho ajustado']=!!op.valor;});
  }else if(op.acao==='importar'){
    var mud=[];
    op.itens.forEach(function(it){R.tx.forEach(function(t){
      if(str(t['TX'])!==String(it.tx))return;
      var antes=num(t['Freq. (MHz)']);
      if(it.cod!==undefined)t['Código']=it.cod;
      if(!(Math.abs(antes-it.freq)<0.0005)){mud.push('TX '+it.tx+': '+(isNaN(antes)?'—':antes.toFixed(3))+' → '+it.freq.toFixed(3));t['Freq. (MHz)']=it.freq;t['Aparelho ajustado']=false;}
      t['Report de origem']=op.gerado;
    });});
    R.imp=R.imp||[];R.imp.push({'Report gerado em':op.gerado,'Importado em':agora(),'Por':op.por||'','Transmissores atualizados':op.itens.length,'Mudanças':mud.join('; ')||'Nenhuma frequência mudou','Nomes sem correspondência':(op.naoCasados||[]).join(', ')});
  }else if(op.acao==='foto'){
    R.elenco.forEach(function(p){if(str(p['ID'])===op.id)p['Foto']=op.preview;});
  }else if(op.acao==='pessoa'){

  }
}
function efetivoCru(R,ep){
  var m={};
  (R.esc||[]).forEach(function(r,i){var e=int(r['EP']),id=str(r['ID']);if(!(e<=ep))return;var c=m[id];
    if(!c||e>c.ep||(e===c.ep&&i>c.i))m[id]={ep:e,i:i,tx:str(r['TX']),cap:str(r['Cápsula']),time:str(r['Time']),obs:str(r['Observações'])};});
  return m;
}
function recalcular(){
  var R=RAW?clone(RAW):{tx:[],rx:[],cap:[],elenco:[],esc:[],eps:[],imp:[]};
  ['tx','rx','cap','elenco','esc','eps','imp'].forEach(function(k){if(!R[k])R[k]=[];});

/* ───────── lógica do episódio ───────── */
function efetivo(ep){
  var m={};
  D.esc.forEach(function(r,i){if(!(r.ep<=ep))return;var c=m[r.id];if(!c||r.ep>c.ep||(r.ep===c.ep&&i>c.i))m[r.id]=Object.assign({i:i},r);});
  return m;
}
function ativo(p,ep){return !(p.elim&&ep>p.elim);}
function tipoCap(p){
  var n=(p.id+' '+p.nome).toLowerCase();
  if(p.papel==='FONTE'&&n.indexOf('goose')>=0)return 'gooseneck';
  if(p.papel==='FONTE'&&n.indexOf('boom')>=0)return 'boom';
  return 'lapela';
}
function situacao(ep){
  var EF=efetivo(ep),uso={tx:{},cap:{}},s={ep:ep,EF:EF,uso:uso,pessoas:[],avisos:0,graves:0};
  D.elenco.forEach(function(p){
    if(!ativo(p,ep))return;
    var e=EF[p.id];if(!e)return;
    if(e.tx)(uso.tx[e.tx]=uso.tx[e.tx]||[]).push(p.id);
    if(e.cap)(uso.cap[e.cap]=uso.cap[e.cap]||[]).push(p.id);
  });
  D.elenco.forEach(function(p){
    var e=EF[p.id]||null,t=e&&e.tx?D.txPor[e.tx]||null:null,av=[],at=ativo(p,ep);
    if(at){
      if(!e||!e.tx)av.push({k:'pend',t:'sem transmissor'});
      else if(!t)av.push({k:'bad',t:'TX '+e.tx+' não existe na planilha'});
      if(t&&t.dev&&ep>t.dev)av.push({k:'bad',t:'TX '+t.num+' foi devolvido após o EP '+t.dev,trocar:true});
      if(e&&e.tx&&uso.tx[e.tx]&&uso.tx[e.tx].length>1)av.push({k:'bad',t:'TX '+e.tx+' repetido'});
      if(e&&e.cap&&uso.cap[e.cap]&&uso.cap[e.cap].length>1)av.push({k:'bad',t:'cápsula '+e.cap+' repetida'});
      if(!e||!e.cap)av.push({k:'pend',t:'sem cápsula'});
      var c=e&&e.cap?D.capPor[e.cap]:null;
      var cc=c&&t?compatCap(c,t):{ok:true};
      if(!cc.ok)av.push({k:'bad',t:'cápsula '+c.id+': '+cc.motivo,c:'cápsula incompatível'});
      else if(cc.ad){var aq=D.capPor[cc.adId],usados=(adaptUso(ep,'')[cc.adId]||0);if(aq&&usados>aq.qtd)av.push({k:'bad',t:'faltam adaptadores MicroDot → '+cc.ad+': '+usados+' em uso, '+aq.qtd+' disponíveis',c:'falta adaptador'});}
      if(c&&c.manut)av.push({k:'warn',t:'cápsula '+c.id+' precisa de manutenção',c:'cápsula em manutenção'});
      if(c&&c.dev&&ep>c.dev)av.push({k:'bad',t:'cápsula '+c.id+' foi devolvida após o EP '+c.dev});
      if(t&&t.num!=='GN'&&!t.rx)av.push({k:'warn',t:'TX sem receptor fixo'});
      if(t&&t.grade&&!t.grade.ok)av.push({k:'bad',t:'freq. '+mhz(t.freq)+' '+t.grade.msg,c:'fora da grade'});
      if(t&&!isNaN(t.freq)&&!t.ajustado&&!(t.dev&&ep>t.dev))av.push({k:'warn',t:'conferir frequência no aparelho',c:'ajustar freq.',ajuste:true});
    }
    av.forEach(function(a){s.avisos++;if(a.k==='bad')s.graves++;});
    s.pessoas.push({p:p,e:e,t:t,herdado:e&&e.ep<ep?e.ep:0,av:av,ativo:at});
  });
  return s;
}
function contaEp(ep){var n=0;D.elenco.forEach(function(p){if(ativo(p,ep)&&p.papel!=='FONTE')n++;});return n;}

/* ───────── rede ───────── */
function setStatus(){
  var b=$('#status');if(!b)return;
  b.className='pill';
  if(MODO==='demo'){b.className+=' demo';b.textContent='demonstração';return;}
  if(NET==='off'){b.className+=' err';b.textContent=FILA.length?FILA.length+' alteração(ões) esperando conexão':'sem conexão';return;}
  if(enviando||NET==='sync'){b.textContent='sincronizando…';return;}
  b.className+=' ok';b.textContent='sincronizado'+(D&&D.lidoEm?' · '+D.lidoEm.slice(11,16):'');
}
function buscar(){
  if(MODO!=='api')return Promise.resolve();
  if(!FILA.length&&!enviando){NET='sync';setStatus();}
  return fetch(urlApi(),{redirect:'follow'}).then(function(r){return r.json();}).then(function(j){
    if(!j.ok&&j.senha){PRECISA_SENHA=true;NET='off';render();return;}
    if(!j.ok)throw new Error(j.erro||'erro');
    var estavaOff=PRECISA_SENHA||!!document.querySelector('#app .banner.err');PRECISA_SENHA=false;
    var antes=JSON.stringify(RAW&&Object.assign({},RAW,{lidoEm:''}));
    RAW=j.dados;jset(K.cache,RAW);NET='';
    if(estavaOff||JSON.stringify(Object.assign({},RAW,{lidoEm:''}))!==antes){recalcular();renderSeguro();}
    else{recalcular();}
  }).catch(function(e){NET='off';}).then(function(){setStatus();if(FILA.length)enviar();});
}
function enviar(){
  if(MODO!=='api'||enviando||!FILA.length)return;
  enviando=true;setStatus();
  var op=FILA[0];
  fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({k:SENHA},op))})
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j.ok&&j.senha){PRECISA_SENHA=true;enviando=false;NET='off';render();return;}
      FILA.shift();jset(K.fila,FILA);
      if(j.dados){RAW=j.dados;jset(K.cache,RAW);}
      if(!j.ok)toast('Não foi salvo: '+(j.erro||'erro na planilha'),true);
      if(op.acao==='importar'&&j.ok)toast(j.mudancas&&j.mudancas.length?j.mudancas.length+' frequência(s) atualizada(s)':'Report importado, nenhuma frequência mudou');
      NET='';enviando=false;recalcular();renderSeguro();
      if(FILA.length)enviar();
    })
    .catch(function(){enviando=false;NET='off';setStatus();});
}
function fazer(op){
  op.por=QUEM||'';
  if(MODO==='demo'){aplicar(RAW,op);if(!jset(K.demo,RAW))toast('O navegador não deixou guardar esta alteração.',true);recalcular();render();return;}
  FILA.push(op);
  if(!jset(K.fila,FILA)&&op.acao==='foto'){FILA.pop();toast('Foto grande demais para guardar offline. Tente de novo com internet.',true);return;}
  recalcular();render();enviar();
}

function capNome(id){var c=D.capPor[id];if(!c)return id;var m=/^(.*\S)\s+([BPM])$/.exec(c.id);

/* ───────── conector da cápsula × entrada do transmissor ───────── */
function normCon(x){x=String(x||'').toLowerCase().replace(/\s+/g,'');if(/micro(dot|lock)/.test(x))return 'microdot';if(/lemo/.test(x))return 'lemo3';if(/ta5/.test(x))return 'ta5f';return x;}
function adaptadores(){return D.cap.filter(function(c){return c.tipo==='adaptador'&&c.para;});}
/* {ok, ad: conector de destino do adaptador ou '', motivo} */
function compatCap(c,t){
  if(!c||c.tipo!=='lapela'||!t)return {ok:true,ad:''};
  if(c.soAna&&txDigital(t))return {ok:false,ad:'',motivo:'só analógico (sem D): não vai em '+t.nome};
  var tc=normCon(t.conector),cc=normCon(c.term);
  if(!tc||!cc||tc===cc)return {ok:true,ad:''};
  if(cc==='microdot'){var a=adaptadores().filter(function(x){return normCon(x.para)===tc;})[0];
    if(a)return {ok:true,ad:a.para,adId:a.id};return {ok:false,ad:'',motivo:'precisa de adaptador MicroDot → '+t.conector+' (não cadastrado)'};}
  return {ok:false,ad:'',motivo:'conector '+c.term+' não entra no '+t.conector+' do '+t.nome};
}
/* adaptadores em uso no episódio (sem contar a pessoa exceto) */
function adaptUso(ep,exceto){
  var EF=efetivo(ep),u={};
  D.elenco.forEach(function(p){if(p.id===exceto||!ativo(p,ep))return;var e=EF[p.id];if(!e||!e.cap||!e.tx)return;
    var k=compatCap(D.capPor[e.cap],D.txPor[e.tx]);if(k.ok&&k.ad)u[k.adId]=(u[k.adId]||0)+1;});
  return u;
}
function txDigital(t){return /DBSMD|A10|DCHT|DBu/i.test(t.modelo||'')||/\bD2\b|HDM|^digital(?!\s*hybrid)/i.test(t.mod||'');}
function primeiroNome(p){return String(p.nome||'').trim().split(/\s+/)[0]||p.nome;}
function capInv(id){var c=D.capPor[id];return !!(c&&c.inv);}
function invIcon(id,sm){return capInv(id)?'<span class="inv'+(sm?' sm':'')+'" title="Polaridade invertida: inverter no transmissor">Ø</span>':'';}
/* colinha 23–32: participantes ativos do episódio, em ordem de transmissor, sem buracos */
function colinhaMap(ep){
  var EF=efetivo(ep),L=D.elenco.filter(function(p){return ativo(p,ep)&&(p.papel==='PARTICIPANTE'||p.papel==='CONVIDADO');});
  L.sort(function(a,b){var x=int((EF[a.id]||{}).tx)||99,y=int((EF[b.id]||{}).tx)||99;return x-y||nat(a.nome,b.nome);});
  var m={};L=L.slice(0,10);L.forEach(function(p,i){m[p.id]=23+i;});
  return {map:m,lista:L};
}
function buscaTxt(x,ch){
  var p=x.p,e=x.e||{},t=x.t;
  var w=[p.nome,p.pista,papelTxt(p),e.tx?'tx '+e.tx+' tx'+e.tx:'',e.cap,timeNome(e.time),ch?'colinha '+ch:'',capInv(e.cap)?'ø inverter polaridade fase':''];
  if(t)w.push(t.nome,t.modelo,t.canal,t.input?'input '+t.input:'',t.rx);

/* nome do transmissor (já traz o número: "DBSMD #4") */
function txNome(t,num){return t?(t.nome||'TX '+t.num):(num?'TX '+num:'TX –');}
/* receptor com o canal, quando o receptor tem mais de um (DSR4, 822, SRB, A10) */
function rxTxt(t){
  if(!t||!t.rx)return '';var r=D.rxPor[t.rx];if(!r)return t.rx;

  return r.id;
}

function ordenar(L,ordem,col){

    out.push('Ch '+(mud[0]+1)+' ⇄ Ch '+(mud[1]+1)+' ('+nomeTok(a.pistas[mud[0]],Ra)+' ⇄ '+nomeTok(a.pistas[mud[1]],Ra)+')');

  else if(mud.length>1&&mud.every(function(i){return !b.pistas[i];}))out.push(faixaTxt(mud.map(function(x){return x+1;}))+' limpos');

/* Objetos viram Map (ordem exata das chaves), números guardam o texto original (1.0 continua 1.0).

function SNum(raw){this.raw=raw;}

function sjParse(txt){
  var i=0,n=txt.length;

  function err(m){throw new Error('Arquivo inválido ('+m+') na posição '+i);}
  function val(){
    ws();var c=txt[i];
    if(c==='{'){i++;var m=new Map();ws();if(txt[i]==='}'){i++;return m;}
      for(;;){ws();if(txt[i]!=='"')err('chave');var k=strv();ws();if(txt[i]!==':')err(':');i++;m.set(k,val());ws();
        if(txt[i]===','){i++;continue;}if(txt[i]==='}'){i++;return m;}err('objeto');}}
    if(c==='['){i++;var a=[];ws();if(txt[i]===']'){i++;return a;}
      for(;;){a.push(val());ws();if(txt[i]===','){i++;continue;}if(txt[i]===']'){i++;return a;}err('lista');}}
    if(c==='"')return strv();
    if(txt.startsWith('true',i)){i+=4;return true;}
    if(txt.startsWith('false',i)){i+=5;return false;}
    if(txt.startsWith('null',i)){i+=4;return null;}
    var mm=/^-?\d+(\.\d+)?([eE][+-]?\d+)?/.exec(txt.slice(i,i+40));if(!mm)err('valor');i+=mm[0].length;return new SNum(mm[0]);
  }

    i++;var s='',st=i;

      if(c==='"'){s+=txt.slice(st,i);i++;return s;}
      if(c==='\\'){s+=txt.slice(st,i);var e=txt[i+1];
        if(e==='u'){s+=String.fromCharCode(parseInt(txt.substr(i+2,4),16));i+=6;}
        else{s+={'"':'"','\\':'\\','/':'/',b:'\b',f:'\f',n:'\n',r:'\r',t:'\t'}[e];i+=2;}

function sjStr(s){
  return '"'+String(s).replace(/[\u0000-\u001f"\\\u007f-\uffff]/g,function(c){
    var m={'"':'\\"','\\':'\\\\','\b':'\\b','\f':'\\f','\n':'\\n','\r':'\\r','\t':'\\t'}[c];

  if(v instanceof Map){var o=[];v.forEach(function(x,k){o.push(sjStr(k)+':'+sjDump(x));});return '{'+o.join(',')+'}';}
  if(Array.isArray(v))return '['+v.map(sjDump).join(',')+']';

  if(typeof v==='string')return sjStr(v);

function sjGet(m,path){var v=m;for(var k=0;k<path.length;k++){if(!(v instanceof Map)||!v.has(path[k]))return undefined;v=v.get(path[k]);}return v instanceof SNum?+v.raw:v;}

function sjSet(m,path,val){
  var v=m;for(var k=0;k<path.length-1;k++){if(!(v instanceof Map)||!v.has(path[k]))return false;v=v.get(path[k]);}
  var last=path[path.length-1];if(!(v instanceof Map)||!v.has(last))return false;

function fonteSlot(s){return s&&s.cn?fonteDeCanal(s.cn,s.t):'';}
function fonteDeCanal(cn,t){var tt={canal:cn,input:t&&t.canal===cn?t.input:''};
  if(!tt.input){var x=D.tx.filter(function(y){return y.canal===cn;})[0];if(x)tt.input=x.input;else{var r=D.rx.filter(function(y){return y.canal===cn;})[0];if(r)tt.input=r.input;}}
  return fonteCanal(tt);}
function fonteCanal(t){
  if(!t)return '';var c=String(t.canal||'').toUpperCase(),m;
  if((m=/^LINE\s*(\d+)/.exec(c)))return 'Adc'+m[1];
  if((m=/^AES\s*(\d+)/.exec(c)))return 'AES3-'+m[1];
  if((m=/^IN\s*(\d+)/.exec(c)))return 'Adc'+m[1];
  if((m=/^DANTE\s*(\d+)/.exec(c)))return 'Dante_'+m[1];
  if((m=/^(RTN|SL6)\s*([ABC][12])/.exec(c)))return FONTE_COD[m[1]+' '+m[2]]||'';
  if(/MIC/.test(c)&&t.input)return 'Adc'+t.input;
  return '';
}
function fonteTxt(f){var m;if(!f||f==='Nosource')return 'sem fonte';if((m=/^Adc(\d+)/.exec(f)))return 'Input '+m[1];if((m=/^AES3-(\d+)/.exec(f)))return 'AES '+m[1];if((m=/^Dante_(\d+)/.exec(f)))return 'Dante '+m[1];var k=Object.keys(FONTE_COD).filter(function(x){return FONTE_COD[x]===f;})[0];return k||f;}

      return '<button type="button" class="led rt '+rotaCls(v)+'" data-act="mled" data-n="'+s.n+'" data-k="r:'+r[0]+'" title="'+r[1]+': '+ROTA_TXT[v]+' (toque para trocar)">'+r[1]+'</button>';}).join('')+'</span>'+

}
function cliqueLed(n,k){
  var c=cenaAtual(),R=resolver(c,UI.ep),M=mesaEf(c,R),ch=M.ch[n],p={};
  if(k==='on'||k==='arm')p[k]=!ch[k];
  else{var b=k.slice(2),i=ROTA_CICLO.indexOf(ch.r[b]||'');p.r={};p.r[b]=ROTA_CICLO[(i+1)%3];}
  /* canal dentro de uma seleção: o mesmo valor vai para todos os selecionados */
  if(MSELS.length>1&&MSELS.indexOf(n)>=0){setChVarios(MSELS,p);return;}
  setCh(n,p);
}
function setChVarios(ns,patch){mudarMesa(function(m){ns.forEach(function(n){var x=m.ch[n]=m.ch[n]||{};
  Object.keys(patch).forEach(function(k){if(k==='r'||k==='sg')x[k]=Object.assign({},x[k]||{},patch[k]);else x[k]=patch[k];});});});}
function grupoAplicar(k,v){
  var c=cenaAtual(),R=resolver(c,UI.ep),M=mesaEf(c,R),ns=MSELS,p={};
  if(k==='on'||k==='arm'){p[k]=v==='1';}
  else if(k==='r'){var b=v,tudo=function(x){return ns.every(function(n){return (M.ch[n].r[b]||'')===x;});};
    p.r={};p.r[b]=tudo('post')?'pre':tudo('pre')?'':'post';}
  else if(k==='rset'){var a2=v.split(':');p.r={};p.r[a2[0]]=a2[1];}
  setChVarios(ns,p);
}

  h+=sdRow('Arm:','<span class="sd-dim">'+est(function(n){return M.ch[n].arm;})+'</span><button class="sd-btn" type="button" data-act="mgrp" data-k="arm" data-v="1">Armar</button><button class="sd-btn" type="button" data-act="mgrp" data-k="arm" data-v="0">Desarmar</button>');

  h+='<p class="sd-nota">Toque num envio para mudar todos juntos: desligado → pós → pré → desligado. Os LEDs acima de qualquer fader selecionado também valem para todos. Shift + clique escolhe de um canal até outro; Ctrl/Cmd + clique soma ou tira um canal.</p></div>';
  return h;

function faixaTxt(ns){var out=[],i=0;while(i<ns.length){var a=ns[i],b=a;while(ns[i+1]===b+1){i++;b=ns[i];}out.push(a===b?'Ch '+a:'Ch '+a+'–'+b);i++;}return out.join(', ');}

function aplicarCopia(){
  var c=cenaAtual(),R=resolver(c,UI.ep),M=mesaEf(c,R),de=COPIA.de,src=M.ch[de],k=COPIA.k,cc=clone(c);
  cc.mesa=cc.mesa||{};cc.mesa.ch=cc.mesa.ch||{};
  COPIA.para.forEach(function(n){if(n===de)return;var patch={};
    if(k.rota){patch.r=clone(src.r);patch.sg=clone(src.sg);}
    ['on','arm','trim','hpf'].forEach(function(x){if(k[x])patch[x]=src[x];});
    if(n<=16&&de<=16){if(k.ph)patch.ph=src.ph;if(k.dly)patch.dly=src.dly;}
    var x=cc.mesa.ch[n]=cc.mesa.ch[n]||{};Object.keys(patch).forEach(function(q){x[q]=patch[q];});
    if(k.conteudo)cc.pistas[n-1]=c.pistas[de-1];});
  salvarCenaMix(cc);
  toast('Ch '+de+' copiado para '+faixaTxt(COPIA.para.slice().sort(function(p,q){return p-q;})));
}

/* ───────── Scorpio: importar, comparar, exportar ───────── */
var KSC='plc_scorpio';
var SC=null; /* {nome, em, txt, m} */
function scCarregar(){if(SC)return SC;var x=jget(KSC,null);if(x&&x.txt){try{SC={nome:x.nome,em:x.em,txt:x.txt,m:sjParse(x.txt)};}catch(e){SC=null;}}return SC;}
function scGuardar(nome,txt){var m=sjParse(txt);if(!(m instanceof Map)||!m.has('InputChannel1')||!m.has('AnalogOutputs'))throw new Error('Esse arquivo não parece um settings do Scorpio.');
  SC={nome:nome,em:agora(),txt:txt,m:m};if(!jset(KSC,{nome:nome,em:SC.em,txt:txt}))toast('O arquivo ficou só nesta sessão (o navegador não deixou guardar).',true);}
function rotaArq(o){var st=o&&o.routeState,g=o?+o.gain:-1275;if(st==='Prefader')return 'pre';if(st==='Postfader')return 'post';if(st==='PostSend'&&g>-1270)return 'send';return '';}
function lerArquivo(m){
  var A={ch:[],nomes:[],fonte:[],bus:{},out:{}};
  for(var n=1;n<=32;n++){var k='InputChannel'+n,ch={r:{},sg:{}};
    BUSES.forEach(function(b){var st=sjGet(m,[k,'bus'+b,'routeState']),g=sjGet(m,[k,'bus'+b,'dB10thsSendGain']);var v=rotaArq({routeState:st,gain:g});ch.r[b]=v;if(v==='send')ch.sg[b]=g/10;});
    ch.on=!sjGet(m,[k,'isMuted']);ch.arm=!!sjGet(m,[k,'isRecordArmed']);ch.iso=sjGet(m,[k,'isoPostFader'])?'post':'pre';
    ch.trim=(sjGet(m,[k,'trimGaindB10ths'])||0)/10;ch.hpf=sjGet(m,[k,'lowcutEnabled'])?sjGet(m,[k,'lowcutHz']):0;
    ch.ph=n<=16?!!sjGet(m,[k,'isPolarityInverted']):null;ch.dly=n<=16?(sjGet(m,[k,'msInputDelay'])||0):null;
    A.ch[n]=ch;A.nomes[n]=sjGet(m,['MetaData','TrackName'+n])||'';A.fonte[n]=sjGet(m,[k,'inputSrcName'])||'';}
  BUSES.forEach(function(b){A.bus[b]={nome:sjGet(m,['OutputBusControl','obus'+b,'userName'])||'',src:b==='L'||b==='R'?'':(sjGet(m,['SlateMicAndReturns','bus'+b])||'')};});
  SAIDAS.forEach(function(o){var p=['AnalogOutputs',o];A.out[o]={nome:sjGet(m,p.concat('userName'))||'',src:srcDoArquivo(sjGet(m,p.concat('source')),sjGet(m,p.concat('chan'))),
    nivel:sjGet(m,p.concat('lineMic'))||'',gain:(sjGet(m,p.concat('dB10thsGain'))||0)/10,dly:sjGet(m,p.concat('msDelay'))||0};});
  return A;
}
function nomeArquivoPista(s){return s.p?nomePista(s.p).slice(0,16):'Ch '+s.n;}
function comparar(R,M,A){
  var L=[];function add(onde,campo,cena,grav){if(String(cena)!==String(grav))L.push([onde,campo,cena,grav]);}
  function rt(v){return ROTA_TXT[v||''];}
  R.S.forEach(function(s){var n=s.n,c=M.ch[n],a=A.ch[n],on='Ch '+n+(s.p?' '+nomePista(s.p):'');
    add(on,'Nome',nomeArquivoPista(s),A.nomes[n]);
    add(on,'Fonte',s.cn?(fonteSlot(s)?fonteTxt(fonteSlot(s)):s.cn+' (código a confirmar)'):'sem fonte',fonteTxt(A.fonte[n]));
    add(on,'ON',c.on?'sim':'não',a.on?'sim':'não');add(on,'ARM',c.arm?'sim':'não',a.arm?'sim':'não');if(a.iso==='post')add(on,'ISO','pré (sempre)','pós');
    BUSES.forEach(function(b){add(on,'→ '+b,rt(c.r[b])+(c.r[b]==='send'?' '+(c.sg[b]||0)+' dB':''),rt(a.r[b])+(a.r[b]==='send'?' '+a.sg[b]+' dB':''));});
    if(c.trim!=null)add(on,'Trim',c.trim+' dB',a.trim+' dB');
    if(c.hpf!=null)add(on,'HPF',c.hpf?c.hpf+' Hz':'desl.',a.hpf?a.hpf+' Hz':'desl.');
    if(c.ph!=null)add(on,'Fase',c.ph?'Ø':'normal',a.ph?'Ø':'normal');
    if(c.dly!=null)add(on,'Delay',c.dly+' ms',a.dly+' ms');
  });
  BUSES.forEach(function(b){add('Bus '+b,'Nome',M.bus[b].nome||'(mantém)',M.bus[b].nome?A.bus[b].nome:'(mantém)');if(b!=='L'&&b!=='R')add('Bus '+b,'Retorno',M.bus[b].src||'—',A.bus[b].src||'—');});
  SAIDAS.forEach(function(o){var c=M.out[o],a=A.out[o];add('Saída '+o,'Nome',c.nome,a.nome);add('Saída '+o,'Fonte',saidaTxt(c.src,M,R),saidaTxt(a.src,M,R));
    if(c.nivel)add('Saída '+o,'Nível',c.nivel,a.nivel);if(c.gain!=null)add('Saída '+o,'Ganho',c.gain+' dB',a.gain+' dB');if(c.dly!=null)add('Saída '+o,'Delay',c.dly+' ms',a.dly+' ms');});
  return L;
}
function trazerDoArquivo(R,A){
  mudarMesa(function(m){
    R.S.forEach(function(s){var a=A.ch[s.n];m.ch[s.n]={on:a.on,arm:a.arm,r:clone(a.r),sg:clone(a.sg),trim:a.trim,hpf:a.hpf,ph:a.ph,dly:a.dly};});
    BUSES.forEach(function(b){m.bus[b]={nome:A.bus[b].nome,src:A.bus[b].src};});
    SAIDAS.forEach(function(o){m.out[o]=clone(A.out[o]);});
  });
}
function deduzidosUsados(M,R){
  var d=[];
  if(R)R.S.forEach(function(x){var f=x.cn?fonteSlot(x):'';if(/^AES3-[1-4]$/.test(f))d.push('Ch '+x.n+' ← '+f+' (fonte)');});
  SAIDAS.forEach(function(o){var s=M.out[o].src||'';if(/^bus:(?!3$)/.test(s)||s==='hp:R'||/^ret:(?!B1$)/.test(s)||s==='com:2')d.push(o+' ← '+s.replace(':',' '));});
  BUSES.forEach(function(b){var s=M.bus[b].src;if(s&&s!=='Bl')d.push('Bus '+b+' ← '+s);});
  return d;
}
function exportar(c,R,M,nome){
  var m=sjParse(SC.txt),rot={'':'Unrouted',post:'Postfader',pre:'Prefader',send:'PostSend'};
  R.S.forEach(function(s){var n=s.n,k='InputChannel'+n,ch=M.ch[n];
    sjSet(m,['MetaData','TrackName'+n],nomeArquivoPista(s));
    sjSet(m,[k,'inputSrcName'],s.cn?(fonteSlot(s)||sjGet(m,[k,'inputSrcName'])):'Nosource');
    sjSet(m,[k,'isRecordArmed'],!!ch.arm);sjSet(m,[k,'isMuted'],!ch.on);sjSet(m,[k,'isoPostFader'],false); /* pistas sempre ISO pré */
    BUSES.forEach(function(b){var v=ch.r[b]||'';
      /* send em −∞ já é "desligado": não mexe para não sujar o arquivo */
      if(!v&&rotaArq({routeState:sjGet(m,[k,'bus'+b,'routeState']),gain:sjGet(m,[k,'bus'+b,'dB10thsSendGain'])})==='')return;
      sjSet(m,[k,'bus'+b,'routeState'],rot[v]);
      if(v==='send')sjSet(m,[k,'bus'+b,'dB10thsSendGain'],Math.round((ch.sg[b]||0)*10));});
    if(ch.trim!=null)sjSet(m,[k,'trimGaindB10ths'],Math.round(ch.trim*10));
    if(ch.hpf!=null){sjSet(m,[k,'lowcutEnabled'],ch.hpf>0);if(ch.hpf>0)sjSet(m,[k,'lowcutHz'],Math.round(ch.hpf));}
    if(n<=16&&ch.ph!=null)sjSet(m,[k,'isPolarityInverted'],!!ch.ph);
    if(n<=16&&ch.dly!=null)sjSet(m,[k,'msInputDelay'],+ch.dly);
  });
  BUSES.forEach(function(b){var x=M.bus[b];if(x.nome)sjSet(m,['OutputBusControl','obus'+b,'userName'],x.nome);if(b!=='L'&&b!=='R')sjSet(m,['SlateMicAndReturns','bus'+b],x.src||'');});
  SAIDAS.forEach(function(o){var x=M.out[o],p=['AnalogOutputs',o],f=srcParaArquivo(x.src);
    sjSet(m,p.concat('userName'),x.nome||'');if(f){sjSet(m,p.concat('source'),f[0]);sjSet(m,p.concat('chan'),f[1]);}
    if(x.nivel)sjSet(m,p.concat('lineMic'),x.nivel);if(x.gain!=null)sjSet(m,p.concat('dB10thsGain'),Math.round(x.gain*10));if(x.dly!=null)sjSet(m,p.concat('msDelay'),Math.round(x.dly));});
  /* saídas em par (link) com fontes diferentes no plano: desfaz o link */
  for(var i=1;i<=9;i+=2){var a1='X'+i,a2='X'+(i+1),la=sjGet(m,['AnalogOutputs',a1,'linkedToOutput']),lb=sjGet(m,['AnalogOutputs',a2,'linkedToOutput']);
    if((la&&la!=='nAnalogOutputs'||lb&&lb!=='nAnalogOutputs')&&M.out[a1].src!==M.out[a2].src){sjSet(m,['AnalogOutputs',a1,'linkedToOutput'],'nAnalogOutputs');sjSet(m,['AnalogOutputs',a2,'linkedToOutput'],'nAnalogOutputs');}}
  sjSet(m,['system','name'],nome);
  return sjDump(m)+'\n';
}
function nomeArq(s){return semAcento(s).replace(/[^A-Za-z0-9 _-]/g,'').trim().replace(/\s+/g,'_').slice(0,24)||'cena';}

  return h+resumoCanais(R,M);

function baixar(nome,txt){

  if(a==='moutsrc'){var oo=el.dataset.o,ov=el.dataset.v;mudarMesa(function(m){m.out[oo]=Object.assign({},m.out[oo]||{},{src:ov});});return true;}
  if(a==='msw'){var cS=cenaAtual(),chS=mesaEf(cS,resolver(cS,UI.ep)).ch[MSEL],kk=el.dataset.k;
    if(kk==='ph')setCh(MSEL,{ph:chS.ph==null?true:chS.ph===true?false:null});
    else if(kk==='hpf')setCh(MSEL,{hpf:chS.hpf==null?(chS.hpfhz||80):chS.hpf>0?0:null});
    return true;}
  if(a==='mcopia'){COPIA=COPIA?null:{de:MSEL||1,k:{conteudo:true,rota:true,on:true,arm:true,trim:true,hpf:true,ph:true,dly:true},para:[]};render();return true;}
  if(a==='mcopiak'){COPIA.k[el.dataset.k]=!COPIA.k[el.dataset.k];render();return true;}

  if(a==='mcopiafim'){COPIA=null;render();return true;}
  if(a==='mbusall'){if(!confirm('Copiar os buses e as saídas desta cena para todas as outras?'))return true;
    var cur=cenaAtual(),mb=(cur.mesa&&cur.mesa.bus)||{},mo=(cur.mesa&&cur.mesa.out)||{};
    cenasLista().forEach(function(x){if(x.id===cur.id)return;var y=clone(x);y.mesa=y.mesa||{};y.mesa.bus=clone(mb);y.mesa.out=clone(mo);salvarCena(y);});toast('Buses e saídas copiados para as outras cenas');return true;}
  if(a==='mscdel'){SC=null;try{localStorage.removeItem(KSC);}catch(e){}render();return true;}
  if(a==='mtrazer'){if(!SC)return true;if(!confirm('Substituir ON, ARM, routing, ajustes, buses e saídas desta cena pelo que está no arquivo?'))return true;
    var c3=cenaAtual(),R3=resolver(c3,UI.ep);trazerDoArquivo(R3,lerArquivo(SC.m));toast('Cena atualizada com o gravador');return true;}
  if(a==='mexport'){if(!SC)return true;var c4=cenaAtual(),R4=resolver(c4,UI.ep),M4=mesaEf(c4,R4),nm=nomeArq($('#mscnome').value||c4.nome);
    try{baixar(nm+'.json',exportar(c4,R4,M4,nm));toast('Settings gerado: '+nm+'.json');}catch(e){toast('Não consegui gerar: '+e.message,true);}return true;}
  return false;
}
function mudancaMesa(a,el){
  var b=el.dataset.b,k=el.dataset.k,r,p;
  if(a==='mrsel'){r={};r[b]=el.value;setCh(MSEL,{r:r});return true;}
  if(a==='msg'){r={};r[b]=parseFloat(el.value)||0;setCh(MSEL,{sg:r});return true;}
  if(a==='mchn'){p={};p[k]=el.value===''?null:parseFloat(el.value);if(p[k]!==null&&isNaN(p[k]))return true;setCh(MSEL,p);return true;}
  if(a==='mchs'){p={};p[k]=el.value===''?null:el.value==='1';setCh(MSEL,p);return true;}

  if(a==='mhpfhz'){var hzv=el.value===''?null:parseFloat(el.value),cH=cenaAtual(),chH=mesaEf(cH,resolver(cH,UI.ep)).ch[MSEL],pt={hpfhz:hzv};if(chH.hpf>0&&hzv>0)pt.hpf=hzv;setCh(MSEL,pt);return true;}

  if(a==='mbussrc'){mudarMesa(function(m){m.bus[b]=Object.assign({},m.bus[b]||{},{src:el.value});});return true;}
  if(a==='moutv'){var o=el.dataset.o;mudarMesa(function(m){var x={};x[k]=k==='nome'?el.value.trim().toUpperCase():el.value;m.out[o]=Object.assign({},m.out[o]||{},x);});return true;}
  if(a==='moutn'){var o2=el.dataset.o;mudarMesa(function(m){var x={};x[k]=el.value===''?null:parseFloat(el.value);m.out[o2]=Object.assign({},m.out[o2]||{},x);});return true;}
  if(a==='mscfile'&&el.files[0]){var f=el.files[0];f.text().then(function(t){try{scGuardar(f.name,t);toast('Settings lido');render();}catch(e){toast(e.message,true);}});return true;}
  return false;
}

  h+='<div class="sd-cols"><div class="sd-col">'+sdRow('Name:','<span class="sd-in nome"><input type="text" maxlength="12" data-act="mbusnome" data-b="'+b+'" value="'+esc(x.nome)+'" placeholder="'+esc(busNome(b))+'"></span>')+
    '<p class="sd-nota">Ganho, limiter e mute do bus ficam como estão no gravador.</p></div><div class="sd-col"><div class="sd-src"><span class="sd-l">ISO</span><div class="sd-grid">';
  for(var n=1;n<=32;n++){var v=M.ch[n].r[b]||'';h+=sdK(String(n),rotaCls(v),'data-act="mrota" data-n="'+n+'" data-b="'+b+'" title="Ch '+n+': '+ROTA_TXT[v]+'"');}
  h+='</div>';
  if(!lr){h+='<span class="sd-l">Com</span><div class="sd-grid w2">'+sdK('Rtn 1',x.src==='_1'?'sel':'','data-act="mbussrcb" data-b="'+b+'" data-v="_1"',1)+sdK('Rtn 2',x.src==='_2'?'sel':'','data-act="mbussrcb" data-b="'+b+'" data-v="_2"',1)+'</div>'+
    '<span class="sd-l">Return</span><div class="sd-grid">'+RET_COD.map(function(r){return sdK(r[1],x.src===r[0]?'sel':'','data-act="mbussrcb" data-b="'+b+'" data-v="'+r[0]+'"',r[0]!=='Bl');}).join('')+'</div>';}
  else h+='<span class="sd-l"></span><p class="sd-nota">L e R não recebem retorno.</p>';
  h+='</div></div></div>';
  h+='<div class="sd-tabs">'+BUSES.map(function(k){return '<button type="button" class="sd-tab'+(k===b?' sel':'')+'" data-act="mbussel" data-v="'+k+'">Bus '+k+(M.bus[k].nome?'<small>'+esc(M.bus[k].nome)+'</small>':'')+'</button>';}).join('')+'</div></div>';
  h+='<p class="hint">ISO colorido = canal mandando para este bus (toque para trocar). * = código ainda não conferido no aparelho. Rtn B ← 633 X3/X4 (Clara) · Com Rtn 1 ← rádio.</p>';
  h+='<div class="linha noprint"><button class="btn" type="button" data-act="mbusall">Usar estes buses e saídas em todas as cenas</button></div>';
  return h;
}
/* outputs: uma saída por vez, fonte única à direita */
function viewOut(R,M){
  var k=UI.mout&&M.out[UI.mout]?UI.mout:'L',o=M.out[k],src=o.src||'',a=src.split(':');
  var h='<div class="sdr"><div class="sd-hd"><span class="sd-ch">'+(k==='L'||k==='R'?k+' Out':k)+'</span><div class="sd-who"><b>'+esc(o.nome||k)+'</b><span>'+esc(saidaTxt(src,M,R))+'</span></div></div>';
  h+='<div class="sd-cols"><div class="sd-col">'+
    sdRow('Name:','<span class="sd-in nome"><input type="text" maxlength="12" data-act="moutv" data-o="'+k+'" data-k="nome" value="'+esc(o.nome)+'"></span>')+
    sdRow('Gain:',sdNum('moutn','gain',o.gain,'dB',false,' data-o="'+k+'"'))+
    sdRow('Delay:',sdNum('moutn','dly',o.dly,'ms',false,' data-o="'+k+'"'))+
    sdRow('Nível:','<select class="sd-sel" data-act="moutv" data-o="'+k+'" data-k="nivel">'+NIVEIS.map(function(nv){return '<option value="'+nv[0]+'"'+(nv[0]===(o.nivel||'')?' selected':'')+'>'+nv[1]+'</option>';}).join('')+'</select>')+
    '<p class="sd-nota">"—" = fica como está no gravador.</p></div><div class="sd-col"><div class="sd-src"><span class="sd-l">ISO</span><div class="sd-grid">';
  for(var n=1;n<=32;n++){var s=R.S[n-1];h+=sdK(String(n),a[0]==='iso'&&+a[1]===n?'sel':'','data-act="moutsrc" data-o="'+k+'" data-v="iso:'+n+':'+(a[0]==='iso'?a[2]:'pre')+'" title="ISO '+n+(s&&s.p?' · '+esc(nomePista(s.p)):'')+'"');}
  h+='</div>';
  if(a[0]==='iso')h+='<span class="sd-l"></span><span class="seg sd-seg"><button type="button" data-act="moutsrc" data-o="'+k+'" data-v="iso:'+a[1]+':pre" aria-pressed="'+(a[2]!=='post')+'">ISO pré</button><button type="button" data-act="moutsrc" data-o="'+k+'" data-v="iso:'+a[1]+':post" aria-pressed="'+(a[2]==='post')+'">ISO pós</button></span>';
  h+='<span class="sd-l">Bus</span><div class="sd-grid">'+BUSES.map(function(b){return sdK(b,src==='bus:'+b?'sel':'','data-act="moutsrc" data-o="'+k+'" data-v="bus:'+b+'" title="'+esc(busNome(b,M))+'"',b!=='3');}).join('')+
    sdK('HP-L',src==='hp:L'?'sel':'','data-act="moutsrc" data-o="'+k+'" data-v="hp:L"')+sdK('HP-R',src==='hp:R'?'sel':'','data-act="moutsrc" data-o="'+k+'" data-v="hp:R"',1)+'</div>';
  h+='<span class="sd-l">Com</span><div class="sd-grid w2">'+sdK('Rtn 1',src==='com:1'?'sel':'','data-act="moutsrc" data-o="'+k+'" data-v="com:1"')+sdK('Rtn 2',src==='com:2'?'sel':'','data-act="moutsrc" data-o="'+k+'" data-v="com:2"',1)+'</div>';
  h+='<span class="sd-l">Return</span><div class="sd-grid">'+RET_ORD.map(function(r){return sdK(r,src==='ret:'+r?'sel':'','data-act="moutsrc" data-o="'+k+'" data-v="ret:'+r+'"',r!=='B1');}).join('')+'</div>';
  h+='<span class="sd-l"></span><div>'+sdK('Silêncio',!src?'sel':'','data-act="moutsrc" data-o="'+k+'" data-v=""')+'</div>';
  h+='</div></div></div>';
  h+='<div class="sd-tabs">'+SAIDAS.map(function(x){return '<button type="button" class="sd-tab'+(x===k?' sel':'')+'" data-act="moutsel" data-v="'+x+'">'+(x==='L'||x==='R'?x+' Out':x)+(M.out[x].nome?'<small>'+esc(M.out[x].nome)+'</small>':'')+'</button>';}).join('')+'</div></div>';
  h+='<h3>Todas as saídas</h3><div class="tabwrap"><table class="tab"><thead><tr><th>Saída</th><th>Nome</th><th>Fonte</th><th>Nível</th><th>Ganho</th><th>Delay</th></tr></thead><tbody>'+
    SAIDAS.map(function(x){var q=M.out[x];return '<tr><td><span class="tag sm">'+x+'</span></td><td class="n">'+esc(q.nome)+'</td><td>'+esc(saidaTxt(q.src,M,R))+'</td><td>'+esc((NIVEIS.filter(function(nv){return nv[0]===(q.nivel||'');})[0]||['',''])[1])+'</td><td>'+(q.gain==null?'—':q.gain+' dB')+'</td><td>'+(q.dly==null?'—':q.dly+' ms')+'</td></tr>';}).join('')+'</tbody></table></div>';
  h+='<p class="hint">* = código ainda não conferido no aparelho. Dante e AES ficam como estão no gravador.</p>';
  h+='<div class="linha noprint"><button class="btn" type="button" data-act="mbusall">Usar estes buses e saídas em todas as cenas</button></div>';
  return h;
}

/* ───────── render ───────── */
function senhaBanner(){
  if(!PRECISA_SENHA)return '';
  return '<div class="banner err noprint"><b>A planilha pede a senha.</b> '+(SENHA?'A senha guardada neste aparelho não confere. ':'')+'Digite a senha para continuar (ela fica só neste aparelho).<div class="linha" style="margin-top:.5rem"><input type="password" id="senhainp" autocomplete="current-password" placeholder="Senha" style="max-width:14rem"><button class="btn pri" type="button" data-act="senha">Entrar</button></div></div>';
}
function render(){
  $('#nav').innerHTML=VIEWS.map(function(v){return '<button type="button" data-act="view" data-v="'+v[0]+'"'+(UI.view===v[0]?' aria-current="page"':'')+'>'+v[1]+'</button>';}).join('');
  if(!D||!D.tx.length&&!D.elenco.length){
    $('#app').innerHTML=senhaBanner()+(MODO==='api'&&!PRECISA_SENHA?'<div class="banner">Carregando dados da planilha…</div>':MODO==='api'?'':'<div class="banner">Sem dados.</div>');
    if(UI.view==='tec')$('#app').innerHTML+=viewTec();
    setStatus();return;
  }
  if(!D.eps.some(function(e){return e.ep===UI.ep;}))UI.ep=1;
  var pre=senhaBanner()+(MODO==='demo'&&UI.view!=='tec'?'<div class="banner">Modo demonstração com dados de exemplo. Para ligar na planilha, abra a aba Técnico.</div>':'');
  if(MODO==='api'&&NET==='off'&&!PRECISA_SENHA)pre='<div class="banner err">Sem conexão. Mostrando os dados de '+esc(D.lidoEm||'—')+(FILA.length?'; '+FILA.length+' alteração(ões) serão enviadas quando a conexão voltar':'')+'.</div>';
  $('#app').innerHTML=pre+({car:viewCar,doc:viewDoc,mix:viewMix,dev:viewDev,tec:viewTec}[UI.view]||viewCar)();
  if(EDIT)renderModal();
  if(UI.view==='car'&&BUSCA)aplicarBusca();
  if(UI.view==='mix'&&(MBUSCA))aplicarBuscaMix();
  setStatus();
}
function renderSeguro(){
  var a=document.activeElement;
  if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.type!=='checkbox'){renderSeguro.pend=true;return;}
  render();
}
document.addEventListener('focusout',function(){setTimeout(function(){if(renderSeguro.pend){var a=document.activeElement;if(!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))){renderSeguro.pend=false;render();}}},80);});

/* ───────── eventos ───────── */
var EVK={shift:false,ctrl:false};
document.addEventListener('click',function(ev){
  EVK={shift:ev.shiftKey,ctrl:ev.ctrlKey||ev.metaKey};
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,v=el.dataset.v;
  if(el.tagName==='INPUT'||el.tagName==='SELECT')return;
  if(cliqueMix(a,el))return;
  if(a==='fecharfora'){if(ev.target===el)fechar();return;}
  if(a==='view'){UI.view=v;salvarUi();render();window.scrollTo(0,0);}
  else if(a==='ep'){UI.ep=+el.dataset.ep;salvarUi();render();}
  else if(a==='avtoggle'){AVOPEN=AVOPEN===el.dataset.v&&el.dataset.v==='bad'?'':el.dataset.v;render();}
  else if(a==='abrir')abrir(el.dataset.id);
  else if(a==='fechar')fechar();
  else if(a==='sync'){if(MODO==='api')buscar();else{UI.view='tec';render();}}
  else if(a==='tx'||a==='cap'||a==='time'){var op={acao:'escalar',ep:UI.ep,id:EDIT};op[a]=v;fazer(op);renderModal();}
  else if(a==='obs'){fazer({acao:'escalar',ep:UI.ep,id:EDIT,obs:$('#obs').value.trim()});renderModal();toast('Observação salva');}
  else if(a==='ajustado'){fazer({acao:'ajustado',tx:el.dataset.tx,valor:true});renderModal();}
  else if(a==='desfazerelim'){fazer({acao:'eliminar',id:EDIT,ep:''});renderModal();}
  else if(a==='fmt'){UI.fmt=v;salvarUi();render();}
  else if(a==='ft'){UI.ft=v;salvarUi();render();}
  else if(a==='print')window.print();
  else if(a==='quem'){QUEM=$('#quem').value.trim();jset(K.quem,QUEM);toast('Nome salvo');}
  else if(a==='api'){var u=$('#api').value.trim();if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){toast('O endereço precisa começar com https://script.google.com e terminar em /exec.',true);return;}
    API=u;jset(K.api,API);MODO='api';RAW=null;FILA=[];jset(K.fila,FILA);recalcular();render();buscar();}
  else if(a==='senha'){var si=$('#senhainp')||$('#senhainp2');var sv=si?si.value:'';if(!sv.trim()){toast('Digite a senha.',true);return;}SENHA=sv;jset(K.senha,SENHA);PRECISA_SENHA=false;toast('Senha guardada neste aparelho');render();buscar();}
  else if(a==='senhalimpa'){SENHA='';jset(K.senha,'');toast('Senha apagada deste aparelho');render();}
  else if(a==='desconectar'){if(FILA.length&&!confirm('Há alterações ainda não enviadas. Desconectar mesmo assim?'))return;
    API='';jset(K.api,'');SENHA='';jset(K.senha,'');PRECISA_SENHA=false;MODO='demo';FILA=[];jset(K.fila,FILA);RAW=jget(K.demo,null)||clone(DEMO);recalcular();render();}
  else if(a==='copiar'){var c=$('#convite');c.select();if(navigator.clipboard)navigator.clipboard.writeText(c.value);toast('Link copiado');}
  else if(a==='resetdemo'){if(confirm('Apagar as alterações da demonstração?')){try{localStorage.removeItem(K.demo);}catch(e){}RAW=clone(DEMO);recalcular();render();}}
  else if(a==='confirmarreport'){var P=PREVIEW;PREVIEW=null;
    fazer({acao:'importar',gerado:P.gerado,itens:P.linhas.map(function(l){return {tx:l.tx,freq:l.depois,cod:l.ok?l.cod:('⚠ '+l.msg)};}),naoCasados:P.nao});
    if(MODO==='demo')toast('Report importado');}
  else if(a==='cancelarreport'){PREVIEW=null;render();}
});
document.addEventListener('change',function(ev){
  var el=ev.target,a=el.dataset.act;
  if(mudancaMix(a,el))return;
  if(a==='ordem'){UI.ordem=el.value;salvarUi();render();}
  else if(a==='elim'){fazer({acao:'eliminar',id:EDIT,ep:el.checked?UI.ep:''});renderModal();}
  else if(a==='foto'&&el.files[0]){var id=EDIT;reduzirFoto(el.files[0],function(url){fazer({acao:'foto',id:id,base64:url.split(',')[1],mime:'image/jpeg',preview:url});renderModal();toast('Foto salva');});}
  else if(a==='report'&&el.files[0]){
    var f=el.files[0];
    f.slice(0,600000).text().then(function(t){
      var rep=lerReport(t);
      if(!rep.itens.length){toast('Não achei a tabela de frequências nesse arquivo.',true);return;}
      PREVIEW=casar(rep);render();
    });
  }
});
document.addEventListener('input',function(ev){var a=ev.target.dataset&&ev.target.dataset.act;
  if(a==='busca'){BUSCA=ev.target.value;aplicarBusca();}
  else if(a==='mbusca'){MBUSCA=ev.target.value;aplicarBuscaMix();}});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&EDIT){fechar();return;}
  if(UI.view==='mix'&&(ev.key==='Delete'||ev.key==='Backspace')&&!/^(INPUT|SELECT|TEXTAREA)$/.test((ev.target&&ev.target.tagName)||'')&&(MSEL||MSELS.length)){ev.preventDefault();esvaziarSel();return;}
  var tg=ev.target&&ev.target.tagName;if(UI.view!=='mix'||/^(INPUT|SELECT|TEXTAREA)$/.test(tg||''))return;
  if((ev.ctrlKey||ev.metaKey)&&(ev.key==='z'||ev.key==='Z')){ev.preventDefault();if(ev.shiftKey)refazerMix();else desfazerMix();}
  else if((ev.ctrlKey||ev.metaKey)&&(ev.key==='y'||ev.key==='Y')){ev.preventDefault();refazerMix();}
  else if((ev.ctrlKey||ev.metaKey)&&(ev.key==='c'||ev.key==='C')&&(MSEL||MSELS.length)&&!String(window.getSelection&&window.getSelection()||'')){ev.preventDefault();copiarSel();}
  else if((ev.ctrlKey||ev.metaKey)&&(ev.key==='v'||ev.key==='V')&&CLIP){ev.preventDefault();colarSel();}
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&MODO==='api')buscar();});

/* ───────── início ───────── */
aplicarCores();recalcular();render();
if(MODO==='api'){buscar();setInterval(function(){if(!document.hidden&&!EDIT)buscar();else if(FILA.length)enviar();},30000);}
window.__plc={lerReport:lerReport,casar:casar,situacao:situacao,get D(){return D;},fazer:fazer,UI:UI,render:render,abrir:abrir};
})();
</script>
</body>
